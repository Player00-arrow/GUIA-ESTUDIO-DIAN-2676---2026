  /* ===================== MEMOFICHAS ===================== */
  cards: [
    ["t1","¿Cuáles son los cuatro elementos del Estado según Naranjo Mesa?","Población, territorio, autoridad y soberanía."],
    ["t1","¿Qué dice el art. 113 de la Constitución?","Son ramas del poder público la legislativa, la ejecutiva y la judicial. Existen además órganos autónomos e independientes. Los órganos tienen funciones separadas pero colaboran armónicamente."],
    ["t1","¿Qué sentencia explica el fundamento de la separación de poderes?","C-312 de 1997: evitar la arbitrariedad de los gobernantes y asegurar la libertad, con control recíproco entre ramas."],
    ["t1","¿Cuáles son las funciones del Congreso según el art. 114?","Reformar la Constitución, hacer las leyes y ejercer control político sobre el gobierno y la administración."],
    ["t1","¿Cómo se elige el Senado y cómo la Cámara?","Senado: circunscripción nacional + circunscripción especial indígena (art. 171). Cámara: circunscripciones territoriales (art. 176)."],
    ["t1","¿Qué prohíbe el art. 150-10 en materia tributaria?","Que el Congreso otorgue facultades extraordinarias al Presidente para decretar impuestos."],
    ["t1","Según el art. 115, ¿qué calidades tiene el Presidente?","Jefe de Estado, Jefe de Gobierno y suprema autoridad administrativa."],
    ["t1","¿Quiénes forman el Gobierno Nacional?","El Presidente, los ministros del despacho y los directores de departamentos administrativos."],
    ["t1","¿Qué es la DIAN según el art. 1 del Decreto 1071 de 1999?","UAE del orden nacional, técnica y especializada, con personería jurídica, autonomía administrativa y presupuestal, patrimonio propio, adscrita al Ministerio de Hacienda y Crédito Público."],
    ["t1","¿Qué régimen presupuestal y de contratación tiene la DIAN?","El de los establecimientos públicos del orden nacional."],
    ["t1","¿Qué figura administrativa explican las UAE según la C-722 de 1999?","La desconcentración de funciones (art. 209 CP)."],
    ["t1","¿Quién administra justicia según el art. 116?","Corte Constitucional, Corte Suprema, Consejo de Estado, Comisión Nacional de Disciplina Judicial, Fiscalía, tribunales, jueces y la Justicia Penal Militar. Excepcionalmente autoridades administrativas y particulares (jurados, conciliadores, árbitros)."],
    ["t1","¿Qué jurisdicción controla la legalidad de una liquidación oficial de la DIAN?","La jurisdicción de lo contencioso administrativo."],
    ["t1","¿Quiénes ejercen el Ministerio Público (art. 118)?","Procurador General, Defensor del Pueblo, procuradores delegados y agentes, personeros municipales y demás que fije la ley."],
    ["t1","¿Qué vigila la Contraloría General (art. 267)?","La gestión fiscal de la administración y de los particulares o entidades que manejen fondos o bienes públicos."],
    ["t1","¿Quién vigila a la Contraloría General?","El Auditor General de la República (art. 274)."],
    ["t1","¿Qué funciones tiene la Registraduría (art. 266)?","Dirección y organización de las elecciones, registro civil e identificación de las personas."],
    ["t1","¿Qué carreras NO administra la CNSC?","Las de carácter especial (art. 130)."],
    ["t1","¿Qué entidades integran el SIVJRNR?","JEP, Comisión para el Esclarecimiento de la Verdad, y Unidad de Búsqueda de Personas dadas por Desaparecidas. Creado por el AL 01 de 2017."],
    ["t2","¿Qué significa que la Constitución es “norma de normas”?","Ante incompatibilidad con la ley u otra norma, se aplica la Constitución (art. 4)."],
    ["t2","Normas rectoras de la Constitución económica","Propiedad privada (58), libertad económica (333), intervención del Estado (334) y poder tributario (338)."],
    ["t2","¿Cuáles son los criterios auxiliares del art. 230?","Equidad, jurisprudencia, principios generales del derecho y doctrina."],
    ["t2","¿Qué significa “ley en sentido material” (C-104/93)?","La Constitución, la ley, los decretos y demás actos jurídicos."],
    ["t2","¿Es la costumbre fuente de derecho?","Sí (C-284/15): se reconoce cuando la Constitución o la ley la invoquen y no se oponga a normas imperativas."],
    ["t2","¿Por qué el principio de justicia y equidad es “bifocal”?","Porque justifica el deber de contribuir y a la vez limita al legislador fiscal (C-388/16)."],
    ["t2","¿Dónde pone la jurisprudencia el límite del poder impositivo (C-464/93)?","En la extinción de la propiedad o de la renta: el tributo no puede destruir las fuentes de riqueza."],
    ["t2","¿Qué dice el inciso 2 del art. 338?","En tasas y contribuciones, las autoridades pueden fijar la tarifa, pero la ley, ordenanza o acuerdo debe fijar el sistema y el método."],
    ["t2","¿Qué dice el inciso 3 del art. 338?","Las normas sobre tributos de período solo se aplican a partir del período que comience después de iniciar su vigencia."],
    ["t2","Tres características de la legalidad tributaria (C-511/19)","Reserva de ley, certeza tributaria y posibilidad de autorizar reglamentación administrativa dentro del marco legal."],
    ["t2","Equidad horizontal vs vertical","Horizontal: igual trato a los iguales. Vertical: trato desigual a los desiguales."],
    ["t2","Dos manifestaciones de la buena fe (T-956/11)","Respeto por el acto propio y confianza legítima."],
    ["t2","¿Qué protege la confianza legítima?","Expectativas válidas frente a cambios súbitos del Estado; exige un período de transición. No protege derechos adquiridos."],
    ["t2","Vertientes de la eficiencia (C-543/05)","Eficiencia del tributo (costo-beneficio) y eficiencia del recaudo (idoneidad de los medios). Ejemplo: papel sellado."],
    ["t2","Pasos del test de no regresividad","Idoneidad, necesidad y proporcionalidad en sentido estricto (C-228/11)."],
    ["t2","¿Qué dice el art. 27 del Código Civil?","Cuando el sentido de la ley sea claro, no se desatenderá su tenor literal a pretexto de consultar su espíritu."],
    ["t2","¿Qué busca la interpretación teleológica?","La finalidad o propósito de la norma."],
    ["t2","¿Quién introdujo la idea de la “razón de la ley”?","Bártolo de Sassoferrato, en la Edad Media."],
    ["t3","Elementos que el art. 338 exige fijar directamente","Sujetos activos y pasivos, hechos generadores, bases gravables y tarifas."],
    ["t3","Sujeto pasivo económico vs de derecho","Económico: soporta el impuesto, no es parte de la obligación sustancial. De derecho: recauda, declara y paga."],
    ["t3","¿Qué dice el art. 683 del Estatuto Tributario?","Espíritu de justicia: el Estado no aspira a exigir al contribuyente más de lo que la ley quiso que aportara."],
    ["t3","¿Quiénes pueden ser sujetos activos en Colombia?","La Nación (DIAN), las entidades territoriales y entidades privadas con parafiscales delegados (Federación Nacional de Cafeteros)."],
    ["t3","Sujetos pasivos en renta que no son personas en el derecho común","Sucesiones ilíquidas, sociedades de hecho, comunidades organizadas, sociedades de minas y algunos fondos."],
    ["t3","Sujeto pasivo de iure y de facto (C-333/17)","De iure paga formalmente; de facto soporta económicamente. Coinciden en directos; se separan en indirectos."],
    ["t3","Elementos del hecho generador","Objetivo, subjetivo, temporal (causación) y espacial."],
    ["t3","¿Qué es la base gravable (C-412/96)?","La magnitud o medición del hecho gravado a la que se aplica la tarifa."],
    ["t3","Base simple vs compuesta","Simple: coincide con la cuantía del hecho gravado. Compuesta: engloba varios hechos de un período."],
    ["t3","Base real vs presuntiva","Real: cuantías reales. Presuntiva: determinación indirecta por presunciones legales."],
    ["t3","Diferencia entre exención y exclusión","La exención hace parte de las inclusiones y luego se detrae; la exclusión no se incluye en la base."],
    ["t3","Tipos de tarifa","Fija, proporcional, progresiva y regresiva (proscrita)."],
    ["t3","Tres reglas de la C-1067 de 2002","No se delega en el Gobierno crear gravámenes; la excepción de fijar tarifa solo aplica a tasas y contribuciones; la ley fija el método y el sistema."],
    ["t3","Método vs sistema (C-455/94)","Método: pautas técnicas para definir criterios de costos y beneficios. Sistema: formas de medición, valoración y ponderación de factores."],
    ["t4","Objetivo de la DIAN (art. 4, D. 1071/99)","Coadyuvar a garantizar la seguridad fiscal del Estado y la protección del orden público económico nacional, mediante la administración y control de obligaciones tributarias, aduaneras y cambiarias, y la facilitación del comercio exterior."],
    ["t4","¿Qué comprende la administración de los impuestos?","Recaudación, fiscalización, liquidación, discusión, cobro, devolución, sanción y demás aspectos del cumplimiento."],
    ["t4","¿Qué es la discusión?","Interposición de recursos en vía administrativa contra liquidaciones oficiales, sanciones, reintegros y demás actos."],
    ["t4","¿Qué es el cobro?","Procedimiento para recuperar la cartera vencida por impuestos, anticipos, retenciones, intereses y sanciones."],
    ["t4","¿Qué es la devolución?","Procedimiento para devolver saldos a favor de renta e IVA y pagos en exceso o de lo no debido, previa solicitud y cumplimiento de requisitos."],
    ["t4","¿Qué impuesto municipal recauda la DIAN?","El ICA consolidado en el régimen SIMPLE (par. 2, art. 908 ET)."],
    ["t4","¿Qué registro administra la DIAN según sus funciones?","El Registro Único de Beneficiarios Efectivos, Finales o Reales (RUB)."],
    ["t4","Cuatro tipos de procesos","Estratégicos, misionales, de apoyo y de evaluación y control."],
    ["t4","Pilares de la seguridad de la información","Confidencialidad, integridad y disponibilidad, más protección de datos personales (SGSI)."],
    ["t4","Riesgos de la administración de cartera","Procedimientos complejos u obsoletos, insuficiente manejo tecnológico, aplicativos inadecuados, falta de competencia gerencial, indebida sustanciación."],
    ["t4","Riesgos del recaudo","Falta de funcionalidad de los sistemas, información contable incompleta, descripción inadecuada de hechos, idoneidad del documento fuente."],
    ["t5","Evolución del nombre del Ministerio de Hacienda","1821 Secretaría de Hacienda; 1886 Hacienda y del Tesoro; 1923 Ministerio de Hacienda y Crédito Público."],
    ["t5","¿Qué hizo el Decreto 2117 de 1992?","Fusionó la DIN y la DAN en la DIAN."],
    ["t5","¿Qué hizo el Decreto 2116 de 1992?","Suprimió la Superintendencia de Cambios y asignó a la DIAN el control cambiario de comercio exterior."],
    ["t5","¿Cuáles son los niveles de la DIAN (D. 1742/20)?","Central, local y delegado."],
    ["t5","¿Cómo se crea una seccional delegada?","Por resolución del Director General, con disponibilidad presupuestal, indicando jurisdicción y grupos internos (art. 7, D. 1742/20)."],
    ["t5","¿Cuántas seccionales de aduanas y de impuestos y aduanas hay?","7 de aduanas y 32 de impuestos y aduanas."],
    ["t5","Órganos asesores y especiales del nivel central","Defensor del Contribuyente y del Usuario Aduanero, y Comité Institucional Estratégico (CIE)."],
    ["t5","Misión de la DIAN","Facilitar y garantizar el entendimiento y cumplimiento de los deberes tributarios, aduaneros y cambiarios, para contribuir a la seguridad fiscal del Estado y la competitividad del país."],
    ["t5","Visión de la DIAN","Ser reconocida como una organización innovadora y referente del Estado y de otras administraciones del mundo, generando confianza y orgullo en sus grupos de interés."],
    ["t5","Valores DIAN","Honestidad, respeto, compromiso, justicia, diligencia e innovación."],
    ["t5","¿Cómo define la DIAN la diligencia?","Cumplo deberes, funciones y responsabilidades con atención, prontitud, destreza y eficiencia, para optimizar el uso de los recursos del Estado."],
    ["t5","Perspectivas del mapa de procesos","Financiera, servicio al cliente, misional y apoyo (4 perspectivas, 7 procesos)."],
    ["t5","¿En qué perspectiva están Administración de cartera y Recaudo-Devoluciones?","En la perspectiva misional."],
    ["t5","Pilares del plan estratégico","Transformación del talento humano, transformación tecnológica, cercanía al ciudadano, legitimidad y sostenimiento fiscal."],
    ["t5","Fundamento del Plan de Choque contra la Evasión y el Contrabando","Ley 223 de 1995, arts. 147 y ss.; se presenta cada año al Ministro de Hacienda."],
    ["t5","Los 5 pilares del Plan de Choque 2020","Gestión de riesgos en datos; focalización y priorización sectorial; desarticulación de estructuras delictivas; control inductivo; control extensivo y facilitación."]
  ],

  /* ===================== QUIZ ===================== */
  quiz: [
    {t:"t1",q:"Según la definición de Naranjo Mesa, ¿cuál de los siguientes NO es un elemento del Estado?",o:["Población","Territorio","Soberanía","Constitución escrita"],a:3,e:"Los elementos son población, territorio, autoridad y soberanía. La Constitución organiza el poder, pero no es un elemento de la definición."},
    {t:"t1",q:"La Asamblea Nacional Constituyente de 1991, frente a la división del poder:",o:["Creó la rama de control y la rama electoral","Mantuvo el modelo tripartito y admitió órganos autónomos e independientes","Adoptó un régimen parlamentario","Eliminó la colaboración armónica"],a:1,e:"Se discutió crear otras ramas, pero se conservó el modelo tripartito con órganos autónomos e independientes (C-312/97)."},
    {t:"t1",q:"¿Qué norma prohíbe que el Congreso otorgue facultades extraordinarias al Presidente para decretar impuestos?",o:["Art. 338","Art. 150-10","Art. 363","Art. 95-9"],a:1,e:"El art. 150-10 prohíbe expresamente conferir facultades extraordinarias para decretar impuestos (C-511/19)."},
    {t:"t1",q:"La DIAN, en relación con el Ministerio de Hacienda y Crédito Público, es una entidad:",o:["Vinculada","Adscrita","Dependencia interna sin personería","Órgano autónomo constitucional"],a:1,e:"Decreto 1071/99, art. 1: UAE con personería jurídica, adscrita al MHCP."},
    {t:"t1",q:"Según la Ley 489 de 1998, una Unidad Administrativa Especial CON personería jurídica pertenece al:",o:["Sector central","Sector descentralizado","Nivel territorial","Ministerio Público"],a:1,e:"Sin personería: sector central. Con personería (como la DIAN): sector descentralizado (art. 68 Ley 489/98)."},
    {t:"t1",q:"El régimen presupuestal y de contratación de la DIAN es el previsto para:",o:["Empresas industriales y comerciales del Estado","Sociedades de economía mixta","Establecimientos públicos del orden nacional","Entidades privadas"],a:2,e:"Así lo dispone el art. 1 del Decreto 1071 de 1999."},
    {t:"t1",q:"Una autoridad administrativa con funciones jurisdiccionales excepcionales NO puede:",o:["Resolver conflictos en materias precisas","Instruir sumarios ni juzgar delitos","Proferir decisiones de fondo","Actuar en todo el territorio"],a:1,e:"Art. 116 CP: no les es permitido adelantar la instrucción de sumarios ni juzgar delitos."},
    {t:"t1",q:"Un contribuyente quiere demandar la liquidación oficial de revisión que le profirió la DIAN. ¿Ante qué jurisdicción acude?",o:["Ordinaria laboral","Constitucional","Contencioso administrativa","Especial para la Paz"],a:2,e:"La jurisdicción contencioso administrativa controla la legalidad de actos particulares como liquidaciones oficiales y resoluciones sanción."},
    {t:"t1",q:"¿Quién ejerce preferentemente el poder disciplinario sobre quienes desempeñan funciones públicas, incluidas las de elección popular?",o:["Contraloría General","Procuraduría General de la Nación","Defensoría del Pueblo","Auditoría General"],a:1,e:"Art. 277 CP, función de la Procuraduría."},
    {t:"t1",q:"La vigilancia de la gestión fiscal de la Contraloría General y de las contralorías territoriales corresponde a:",o:["La Procuraduría","El Congreso","La Auditoría General de la República","El Consejo de Estado"],a:2,e:"Art. 274 CP."},
    {t:"t1",q:"Ser prestamista de última instancia y agente fiscal del gobierno son funciones de:",o:["El Ministerio de Hacienda","La DIAN","El Banco de la República","La Superintendencia Financiera"],a:2,e:"Art. 371 CP."},
    {t:"t1",q:"¿Cuál de estas entidades NO integra el Sistema Integral de Verdad, Justicia, Reparación y No Repetición?",o:["JEP","Comisión de la Verdad","Unidad de Búsqueda de Personas Desaparecidas","Consejo Nacional Electoral"],a:3,e:"El CNE es parte de la organización electoral."},
    {t:"t1",q:"La Comisión Nacional del Servicio Civil administra y vigila:",o:["Todas las carreras sin excepción","Las carreras de los servidores, excepto las de carácter especial","Solo la carrera de la DIAN","Solo la carrera judicial"],a:1,e:"Art. 130 CP."},
    {t:"t2",q:"Según el art. 230 CP, son criterios auxiliares de la actividad judicial:",o:["Ley, decreto, resolución y circular","Equidad, jurisprudencia, principios generales del derecho y doctrina","Costumbre, analogía, conceptos DIAN y tratados","Constitución, ley, costumbre y equidad"],a:1,e:"Los cuatro criterios auxiliares del art. 230."},
    {t:"t2",q:"Según la C-284 de 2015, NO es un criterio para definir la jerarquía entre normas:",o:["Contenido","Órgano que la adopta","Procedimiento de aprobación","Fecha de publicación"],a:3,e:"Los criterios son contenido, órgano y procedimiento."},
    {t:"t2",q:"¿Cuál de estas normas forma parte de la “Constitución económica” como principio rector de la libertad económica?",o:["Art. 58","Art. 333","Art. 334","Art. 338"],a:1,e:"58 propiedad, 333 libertad económica, 334 intervención, 338 poder tributario."},
    {t:"t2",q:"El principio de justicia y equidad tributaria se considera “bifocal” porque:",o:["Aplica a impuestos nacionales y territoriales","Justifica el deber de contribuir y a la vez limita al legislador","Tiene dos artículos constitucionales","Protege a personas naturales y jurídicas"],a:1,e:"C-388 de 2016."},
    {t:"t2",q:"Un concejo municipal crea una tasa y autoriza al alcalde a fijar la tarifa, sin señalar cómo se calcularán los costos. Según el art. 338, la norma es:",o:["Válida, porque las tasas permiten delegar la tarifa","Inconstitucional, porque falta fijar el sistema y el método","Válida si el alcalde publica la tarifa","Inconstitucional, porque los concejos no pueden crear tasas"],a:1,e:"La autoridad puede fijar la tarifa de tasas y contribuciones, pero el acuerdo debe fijar el sistema y el método (C-1067/02)."},
    {t:"t2",q:"Una ley publicada en junio modifica la depuración del impuesto de renta (impuesto de período anual). ¿Desde cuándo aplica?",o:["Desde su publicación","Desde el 1 de julio","Desde el período gravable que comience después de su vigencia","Retroactivamente al 1 de enero"],a:2,e:"Art. 338, inciso 3, y art. 363: irretroactividad en impuestos de período."},
    {t:"t2",q:"Dar igual trato a quienes están en igual situación corresponde a la:",o:["Equidad vertical","Equidad horizontal","Progresividad","Eficiencia"],a:1,e:"Horizontal: iguales con igual trato. Vertical: desiguales con trato desigual."},
    {t:"t2",q:"La confianza legítima, según la T-1094 de 2005, protege:",o:["Derechos adquiridos","Expectativas válidas creadas por actuaciones estatales prolongadas","La facultad del Estado de cambiar reglas sin aviso","Solo a personas jurídicas"],a:1,e:"No son derechos adquiridos; son expectativas válidas que exigen un período de transición."},
    {t:"t2",q:"El ejemplo del impuesto de papel sellado ilustra el principio de:",o:["Progresividad","Eficiencia del tributo","Irretroactividad","Igualdad"],a:1,e:"Su administración era más costosa que lo recaudado: relación costo-beneficio negativa (C-543/05)."},
    {t:"t2",q:"¿Qué artículo de la Constitución dispone que el sistema tributario se funda en equidad, eficiencia y progresividad?",o:["Art. 95","Art. 338","Art. 363","Art. 359"],a:2,e:"Art. 363, que además prohíbe la aplicación retroactiva de las leyes tributarias."},
    {t:"t2",q:"Los pasos del test de no regresividad usado por la Corte son:",o:["Legalidad, certeza y reserva","Idoneidad, necesidad y proporcionalidad en sentido estricto","Contenido, órgano y procedimiento","Objetivo, subjetivo y temporal"],a:1,e:"C-228 de 2011."},
    {t:"t2",q:"“Cuando el sentido de la ley sea claro, no se desatenderá su tenor literal a pretexto de consultar su espíritu”. Este es el método:",o:["Teleológico","Histórico","Gramatical o literal","Sistemático"],a:2,e:"Art. 27 del Código Civil."},
    {t:"t2",q:"Revisar las actas del debate legislativo para entender una norma corresponde a la interpretación:",o:["Histórica","Lógica","Literal","Teleológica"],a:0,e:"La histórica estudia antecedentes como el debate legislativo."},
    {t:"t2",q:"Según el art. 29 CP, la prueba obtenida con violación del debido proceso es:",o:["Anulable a petición de parte","Válida si es útil","Nula de pleno derecho","Inexistente solo en materia penal"],a:2,e:"Texto literal del art. 29."},
    {t:"t3",q:"En el IVA, el consumidor final que soporta el impuesto es:",o:["Sujeto activo","Sujeto pasivo de derecho","Sujeto pasivo económico","Agente retenedor"],a:2,e:"Soporta el impuesto, pero no es parte de la obligación sustancial."},
    {t:"t3",q:"Según el art. 683 del ET, el espíritu de justicia implica que:",o:["El funcionario maximice el recaudo","El Estado no aspira a exigir más de lo que la ley quiso","El contribuyente siempre tiene la razón","Las dudas se resuelven a favor del fisco"],a:1,e:"Es una regla de conducta de los funcionarios en liquidación y recaudo."},
    {t:"t3",q:"La Federación Nacional de Cafeteros, respecto de ciertas contribuciones parafiscales, puede actuar como:",o:["Sujeto pasivo económico","Sujeto activo (entidad privada con competencia delegada)","Órgano de control","Autoridad doctrinal"],a:1,e:"El módulo la cita como ejemplo de entidad privada sujeto activo."},
    {t:"t3",q:"¿Cuál de estos NO es sujeto pasivo en renta pese a no ser persona en el derecho común?",o:["Sucesión ilíquida","Sociedad de hecho","Comunidad organizada","Consorcio de hecho de vecinos sin organización"],a:3,e:"El módulo menciona sucesiones ilíquidas, sociedades de hecho, comunidades organizadas, sociedades de minas y algunos fondos."},
    {t:"t3",q:"El elemento del hecho generador que define cuándo nace y es exigible la obligación es el:",o:["Objetivo","Subjetivo","Temporal","Espacial"],a:2,e:"El temporal, también llamado causación."},
    {t:"t3",q:"La base gravable del impuesto de renta se obtiene principalmente por:",o:["Establecimiento directo","Integración","Depuración","Presunción absoluta"],a:2,e:"Ingreso bruto menos costos, gastos y rentas exentas = renta líquida gravable."},
    {t:"t3",q:"En el IVA, sumar al precio los gastos de financiación, acarreos y seguros es un proceso de:",o:["Depuración","Integración","Exclusión","Exención"],a:1,e:"La base del IVA se integra con gastos accesorios."},
    {t:"t3",q:"Un valor que hace parte de las inclusiones de la base pero que el legislador ordena detraer después es una:",o:["Exclusión","Exención","Deducción lógica","Base presuntiva"],a:1,e:"La exención sí entra a la base y luego se detrae; la exclusión nunca entra."},
    {t:"t3",q:"El timbre sobre cheques a razón de 0,0003 UVT por cheque es ejemplo de tarifa:",o:["Fija","Proporcional","Progresiva","Regresiva"],a:0,e:"Cuantía fija por operación (art. 521 ET)."},
    {t:"t3",q:"Una tarifa que disminuye a medida que aumenta la base gravable es:",o:["Progresiva y permitida","Regresiva y proscrita","Proporcional","Fija"],a:1,e:"Conceptualmente regresiva; el ordenamiento la proscribe."},
    {t:"t3",q:"Según la C-455 de 1994, las “formas específicas de medición económica, de valoración y ponderación de los factores” corresponden al concepto de:",o:["Método","Sistema","Base","Hecho generador"],a:1,e:"Método: pautas técnicas para definir criterios. Sistema: formas de medición y valoración."},
    {t:"t4",q:"El objetivo de la DIAN está consagrado en:",o:["Art. 1 del D. 1742/2020","Art. 4 del D. 1071/1999","Art. 3 del D. 4048/2008","Art. 338 CP"],a:1,e:"Art. 4 del Decreto 1071 de 1999."},
    {t:"t4",q:"Según el listado del módulo, ¿qué función aparece en la administración de impuestos pero NO en la de derechos de aduana?",o:["Cobro","Sanción","Devolución","Discusión"],a:2,e:"La devolución de saldos a favor y pagos en exceso o de lo no debido es propia de los impuestos internos en el esquema del módulo."},
    {t:"t4",q:"El procedimiento para recuperar deudas vencidas por impuestos, anticipos, retenciones, intereses y sanciones es:",o:["Discusión","Fiscalización","Cobro","Recaudación"],a:2,e:"Definición de cobro del módulo."},
    {t:"t4",q:"La interposición de recursos en vía administrativa contra liquidaciones oficiales corresponde a la función de:",o:["Discusión","Liquidación","Sanción","Devolución"],a:0,e:"Discusión."},
    {t:"t4",q:"¿Qué impuesto, aunque territorial, es recaudado por la DIAN?",o:["Predial","ICA consolidado en el régimen SIMPLE","Impuesto de vehículos","Impuesto al consumo de cervezas"],a:1,e:"Parágrafo 2 del art. 908 ET."},
    {t:"t4",q:"Los procesos que incluyen medición, seguimiento, auditoría interna y acciones correctivas son los:",o:["Estratégicos","Misionales","De apoyo","De evaluación y control"],a:3,e:"Evaluación y control."},
    {t:"t4",q:"Para un funcionario de cartera, un riesgo identificado por la DIAN en su área es:",o:["Deficiencias del RUT","Indebida sustanciación de los procesos","Falta de metodología de muestreo","Indicadores inapropiados"],a:1,e:"Administración de cartera: trámites complejos, tecnología insuficiente, aplicativos inadecuados, falta de competencia gerencial, indebida sustanciación."},
    {t:"t4",q:"La política de seguridad de la información de la DIAN busca preservar:",o:["Rapidez, costo y calidad","Confidencialidad, integridad y disponibilidad","Legalidad, certeza y reserva","Publicidad total de la información"],a:1,e:"Además de la protección de datos personales, mediante el SGSI."},
    {t:"t4",q:"Es función de la DIAN según el D. 4048 de 2008:",o:["Emitir la moneda legal","Ejercer funciones de Policía Judicial","Vigilar la gestión fiscal de las contralorías","Administrar la carrera de todos los servidores públicos"],a:1,e:"Numeral 9 del art. 3."},
    {t:"t5",q:"¿En qué año el Ministerio adoptó el nombre de Ministerio de Hacienda y Crédito Público?",o:["1821","1886","1923","1991"],a:2,e:"1821 Secretaría de Hacienda, 1886 Hacienda y del Tesoro, 1923 MHCP."},

    diagrams: ["recibos", "conceptos"],
    blocks: [
      { h: "Formulario 490: Recibo Oficial de Pago de Impuestos Nacionales", html: `
        <p>Lo usan <mark>todas las personas naturales o jurídicas responsables principales, solidarias o subsidiarias</mark> que paguen impuestos nacionales <b>por cualquier año gravable</b>.</p>
        <p><b>No aplica</b> para tributos aduaneros ni obligaciones cambiarias.</p>
        <p>El campo clave es el <mark>código de concepto</mark>: permite asociar el pago a la obligación financiera en el sistema informático. Un código equivocado hace que el pago quede mal imputado, un problema típico de cartera.</p>` },
      { h: "Códigos de concepto más preguntables", html: `
        <ul>
          <li><b>04</b> Renta: 1 período.</li>
          <li><b>05</b> Ventas bimestral: 6 períodos · <b>57</b> Ventas cuatrimestral: 3 · <b>58</b> Ventas anual: 1.</li>
          <li><b>07</b> Sanción independiente.</li>
          <li><b>08</b> Retenciones que no requieren declaración (venta de activos fijos, ganancia ocasional).</li>
          <li><b>20</b> Gasolina y ACPM: mensual 12 · <b>21</b> Consumo: bimestral 6 · <b>86</b> Carbono: bimestral 6.</li>
          <li><b>22</b> Ganancia ocasional (art. 163 Ley 1607/12).</li>
          <li><b>27</b> Impuesto unificado del régimen SIMPLE.</li>
          <li><b>28</b> Normalización tributaria · <b>25</b> Riqueza y normalización.</li>
          <li><b>54</b> Impuesto al patrimonio.</li>
          <li><b>55 / 56</b> Sanciones de precios de transferencia (individual / consolidada).</li>
          <li><b>61 a 64</b> Retenciones mensuales: 61 renta y autorretención, 62 IVA, 63 timbre, 64 CREE.</li>
          <li><b>69 / 70</b> Impuesto solidario por COVID-19 (3 períodos).</li>
          <li><b>71</b> Sanción del parágrafo del art. 651 ET · <b>72</b> sanción de activos en el exterior · <b>73</b> documentación comprobatoria.</li>
          <li><b>85</b> Monotributo · <b>88</b> aporte de notarías: mensual 12.</li>
          <li><b>99</b> GMF: <mark>semanal, 53 períodos</mark>.</li>
        </ul>
        <div class="nota">Varios códigos corresponden a tributos ya derogados o transitorios (CREE, IMAS, monotributo, seguridad democrática, solidario COVID). Siguen existiendo porque el 490 sirve para pagar <b>cualquier año gravable</b>, incluidas deudas antiguas en cartera.</div>` },
      { h: "Formulario 690: tributos aduaneros y sanciones cambiarias", html: `
        <p>Lo diligencian los usuarios del servicio aduanero o cambiario en estos casos:</p>
        <p><b>Aduaneros</b>:</p>
        <ul>
          <li>Cuotas de <b>importaciones temporales de largo plazo o leasing</b>.</li>
          <li><b>Saldos pendientes</b> de declaraciones de importación cuyos tributos y sanciones no se pagaron al presentarlas.</li>
          <li>Pago consolidado de importaciones simplificadas de <b>tráfico postal y envíos urgentes</b>.</li>
          <li>Declaraciones de <b>finalización de sistemas especiales</b> de importación-exportación.</li>
          <li>Pago consolidado de importaciones ordinarias de <b>usuarios aduaneros permanentes</b>.</li>
          <li><b>Tributo único</b> a cargo de los viajeros.</li>
          <li><b>Sanciones</b> no liquidadas en la declaración de importación, corrección o legalización, o establecidas por acto administrativo.</li>
          <li><b>Gravamen único ad valorem</b> de viajeros procedentes de <mark>Maicao, Uribia y Manaure</mark>.</li>
          <li>Pago con <b>títulos valores</b>: CERT, TIDIS, CDTUR, bonos de financiamiento presupuestal, títulos judiciales.</li>
        </ul>
        <p><b>Cambiarios</b>: sanciones propuestas e impuestas dentro de los procesos administrativos cambiarios.</p>` }
    ],
    trampas: [
      "490 = impuestos nacionales de CUALQUIER año gravable. NO sirve para aduaneros ni cambiarios.",
      "690 = tributos aduaneros Y sanciones cambiarias.",
      "IVA: 05 bimestral (6), 57 cuatrimestral (3), 58 anual (1). Renta es 04.",
      "GMF código 99: SEMANAL, 53 períodos.",
      "Retenciones 61-64 son MENSUALES (12 períodos).",
      "Gravamen único ad valorem de Maicao, Uribia y Manaure se paga con el 690."
    ]
  },
  /* ---------------- TEMA 3 ---------------- */
  {
    id: "t3", short: "Garantías y pólizas",
    title: "Seguros y pólizas de garantía: facilidades de pago, ámbito aduanero y devoluciones",
    sintesis: `Las garantías y cauciones a favor de la Nación prestan mérito ejecutivo desde la ejecutoria del acto que declara el incumplimiento o la exigibilidad de la obligación garantizada (art. 828-4 ET). Se usan en tres escenarios: facilidades de pago, operaciones aduaneras y devoluciones con garantía.`,
    diagrams: ["garantias"],
    blocks: [
      { h: "La garantía como título ejecutivo (art. 828-4 ET)", html: `
        <blockquote>Prestan mérito ejecutivo: «4. Las garantías y cauciones prestadas a favor de la Nación para afianzar el pago de las obligaciones tributarias, a partir de la <b>ejecutoria del acto de la Administración que declare el incumplimiento o exigibilidad</b> de las obligaciones garantizadas.»</blockquote>
        <div class="nota">Complemento útil: el art. 828 ET enumera cinco títulos ejecutivos: (1) liquidaciones privadas y sus correcciones con constancia de no pago, (2) liquidaciones oficiales ejecutoriadas, (3) demás actos administrativos ejecutoriados que fijen sumas líquidas, (4) garantías y cauciones, y (5) sentencias y decisiones jurisdiccionales ejecutoriadas. Contrástalo con el texto vigente del ET.</div>` },
      { h: "El seguro y la póliza (Código de Comercio)", html: `
        <p><b>Seguro (art. 1036 C. Co.)</b>: el módulo lo define como contrato <b>solemne</b>, bilateral, oneroso, aleatorio y de ejecución sucesiva, que se perfecciona cuando el asegurador suscribe la póliza.</p>
        <p><b>Póliza (art. 1046 C. Co.)</b>: documento que perfecciona y prueba el contrato. Se redacta en castellano, la firma el asegurador y se entrega en original al tomador <mark>dentro de los 15 días siguientes</mark> a su expedición.</p>
        <div class="nota">Actualización importante: desde la <b>Ley 389 de 1997</b>, el art. 1036 dice que el seguro es un contrato <b>consensual</b> (no solemne), y la póliza pasó a ser principalmente un medio de prueba. El módulo usa la redacción anterior. Si la pregunta es de norma vigente, responde “consensual”.</div>` },
      { h: "Facilidades de pago (arts. 814 y 814-2 ET)", html: `
        <p>El <b>art. 814</b> permite otorgar facilidades de pago al deudor de obligaciones tributarias, aduaneras o cambiarias, previo procedimiento y con garantías como <b>pólizas de seguro</b>.</p>
        <p><b>Art. 814-2</b>: si se declara sin efecto la facilidad y se ordena hacer efectiva la garantía, el garante tiene <mark>10 días</mark> desde la ejecutoria de esa resolución para consignar el valor garantizado hasta concurrencia del saldo insoluto. Si no paga, se libra <b>mandamiento de pago</b> en su contra y se decretan <b>embargo y secuestro</b>.</p>
        <p><b>Consejo de Estado, 15 de mayo de 2014, exp. 19710</b>: la ejecutoria del acto que declara sin vigencia la facilidad es el momento en que las garantías (del contribuyente, socios o terceros) se convierten en título ejecutivo. El art. 814 <b>no exige</b> que la DIAN expida un acto previo aceptando la garantía o la calidad de garante.</p>` },
      { h: "Garantías en el ámbito aduanero (Decreto 1165 de 2019)", html: `
        <ul>
          <li>Requieren <b>aceptación o certificación</b> de la DIAN como requisito para iniciar actividades, conservar la autorización o habilitación como usuario aduanero, o iniciar una operación o trámite.</li>
          <li>Son <mark>irrevocables</mark>, deben mantenerse <b>vigentes mientras dure el objeto asegurable</b> y se constituyen a favor de la <b>Nación - DIAN</b>.</li>
          <li>Debe constar que la aseguradora o el banco <mark>renuncia al beneficio de excusión</mark>.</li>
          <li>Si la garantía es insuficiente, el saldo insoluto se cobra sobre el patrimonio del deudor, <b>prenda general de los acreedores</b> (art. 28 D. 1165/19).</li>
        </ul>
        <p>Clases:</p>
        <ul>
          <li><b>Globales</b>: amparan <b>varias</b> operaciones de un mismo responsable. Quien la tiene vigente no debe constituir específicas, salvo garantías en reemplazo de medida cautelar.</li>
          <li><b>Específicas</b> (art. 29 D. 1165/19): amparan <b>una sola</b> operación o trámite; el objeto indica la disposición legal que contiene la obligación.</li>
          <li><b>De pleno derecho</b>: garantía <mark>real</mark> prevista solo para el <b>tránsito aduanero comunitario</b>; recae sobre el medio de transporte o las unidades de carga registrados ante la Subdirección de Gestión de Registro Aduanero.</li>
        </ul>` },
      { h: "Garantía en devoluciones (art. 860 ET)", html: `
        <p>En la devolución de impuestos se puede presentar una garantía a favor de la Nación, otorgada por <b>entidades bancarias o compañías de seguros</b>, por valor equivalente al <mark>monto objeto de devolución más las sanciones del art. 670 ET</mark> (devolución improcedente).</p>
        <p><b>Consejo de Estado, sentencia 22679 de 2020</b>: la póliza cumplía el art. 860 porque era (i) una garantía en contrato de seguro, (ii) a favor de la Nación, (iii) de una aseguradora y (iv) por el monto de la devolución. Como la liquidación oficial de revisión se notificó <b>dentro de los dos años de vigencia</b>, la aseguradora quedó como <mark>responsable solidaria</mark> por el saldo devuelto improcedentemente, los intereses moratorios y las sanciones.</p>` }
    ],
    trampas: [
      "La garantía presta mérito ejecutivo desde la EJECUTORIA del acto que declara el incumplimiento, no desde su expedición.",
      "Art. 814-2: el garante tiene 10 DÍAS para pagar; si no, mandamiento de pago con embargo y secuestro.",
      "No se requiere acto previo de la DIAN aceptando la garantía de la facilidad (CE, exp. 19710 de 2014).",
      "Póliza: entregar al tomador dentro de 15 DÍAS. Seguro hoy es CONSENSUAL (Ley 389 de 1997).",
      "Garantía de pleno derecho: REAL y SOLO para tránsito aduanero comunitario.",
      "Garantía en devoluciones (art. 860): monto devuelto + sanciones del art. 670. El garante responde solidariamente."
    ]
  },
  /* ---------------- TEMA 4 ---------------- */
  {
    id: "t4", short: "Actos administrativos y sentencias",
    title: "Documentos administrativos y judiciales: liquidaciones oficiales, resoluciones sanción, recursos y sentencias",
    sintesis: `La DIAN, en ejercicio de sus facultades de determinación, revisión, sanción y discusión, expide actos que luego se convierten en títulos ejecutivos con un crédito a favor de la Nación. A ellos se suman las sentencias de jueces y magistrados.`,
    diagrams: ["actos"],
    blocks: [
      { h: "Actos administrativos de la DIAN", html: `
        <p>Se emiten en ejercicio de las facultades de <mark>determinación, revisión, sanción y discusión</mark> y luego se convierten en <b>títulos ejecutivos</b>:</p>
        <ol>
          <li>Liquidaciones oficiales.</li>
          <li>Resoluciones sanción.</li>
          <li>Resoluciones que resuelven los recursos de reconsideración, reposición o apelación.</li>
        </ol>` },
      { h: "Liquidaciones oficiales", html: `
        <p>Actos <b>definitivos</b> mediante los cuales la administración <b>determina o revisa</b> los impuestos y aplica las sanciones a que haya lugar.</p>
        <ul>
          <li><b>Aforo</b>: cuando el obligado no declaró.</li>
          <li><b>Revisión</b>: modifica la declaración privada.</li>
          <li><b>Corrección aritmética</b>: corrige errores de cálculo de la declaración.</li>
          <li><b>Provisional</b>: determinación simplificada y anticipada.</li>
        </ul>
        <div class="nota">El módulo solo las enumera. Para fijar la diferencia: aforo = no declaró; revisión = declaró pero hay inexactitud de fondo; corrección aritmética = error de operaciones; provisional = mecanismo abreviado (art. 764 ET). Profundiza en el módulo de procedimiento.</div>` },
      { h: "Resoluciones sanción y recursos", html: `
        <p><b>Resoluciones sanción</b>: actos definitivos con los que la DIAN impone sanciones por obligaciones diferentes a la de declarar (según el módulo).</p>
        <p><b>Actos que resuelven recursos</b> interpuestos por el administrado:</p>
        <ul><li>Reconsideración.</li><li>Reposición.</li><li>Apelación.</li></ul>` },
      { h: "Sentencias", html: `
        <p>Las providencias de jueces o magistrados son fuente de obligaciones a favor de la DIAN. Para conformar el título solo se requiere la <mark>sentencia de condena con constancia de ejecutoria</mark>, de la que se derive una obligación <b>clara, expresa y exigible</b>, no sometida a plazo o condición (numeral 2 del art. 114 del Código General del Proceso).</p>` }
    ],
    trampas: [
      "Los actos administrativos se vuelven título ejecutivo; contienen un crédito a favor de la Nación.",
      "Cuatro liquidaciones oficiales: aforo, revisión, corrección aritmética y provisional.",
      "Tres recursos citados: reconsideración, reposición y apelación.",
      "Sentencia como título: condena + constancia de ejecutoria + obligación clara, expresa y exigible (art. 114-2 CGP)."
    ]
  },
  /* ---------------- TEMA 5 ---------------- */
  {
    id: "t5", short: "Canales de presentación e IFE",
    title: "Canales de presentación de declaraciones: presencial, virtual, instrumento de firma electrónica y APP DIAN",
    sintesis: `Las declaraciones pueden presentarse por canal presencial (litográfico, en bancos) o virtual (Servicios Informáticos Electrónicos con IFE). El canal lo determinan el sujeto y el tipo de declaración. Quien está obligado a presentar virtualmente y lo hace por otro medio, tiene la declaración por no presentada.`,
    diagrams: ["canales", "ife"],
    blocks: [
      { h: "Qué determina el canal", html: `
        <p>Dos factores: <mark>el sujeto</mark> y <mark>el tipo de declaración</mark>.</p>
        <ul>
          <li><b>Resolución 12761 de 2011</b>: lista <b>taxativa</b> de sujetos obligados a presentar virtualmente y, por tanto, a tener IFE.</li>
          <li><b>Resolución 000080 de 2020</b>: llama a los titulares del IFE <mark>“suscriptores”</mark> y permite a los <b>no obligados</b> optar voluntariamente por la presentación virtual.</li>
        </ul>` },
      { h: "Canal presencial", html: `
        <p>Por el <b>sujeto</b>, se usa cuando:</p>
        <ul><li>No está obligado a presentar virtualmente.</li><li>Hay <b>contingencia</b> en los sistemas de la DIAN.</li></ul>
        <p>Por la <b>declaración</b>: algunas solo pueden ser virtuales; por exclusión, las demás pueden presentarse presencialmente.</p>
        <p>La declaración <b>litográfica</b> se genera con tres opciones en dian.gov.co:</p>
        <ul>
          <li><b>Usuario no registrado</b>: diligencia en la página, imprime, firma y presenta en la entidad financiera autorizada.</li>
          <li><b>Usuario nuevo</b>: habilita una cuenta asignando contraseña y pasa de inmediato a ser usuario registrado.</li>
          <li><b>Usuario registrado</b>: diligencia, imprime y lleva <b>original y copia</b> a la entidad financiera autorizada.</li>
        </ul>` },
      { h: "Canal virtual", html: `
        <p>Por el <b>sujeto</b>, se usa cuando está <b>obligado</b> o cuando es <b>voluntario</b>.</p>
        <p>Por la <b>declaración</b>: algunas solo se presentan virtualmente, por ejemplo la del <mark>GMF</mark>, la de <mark>activos en el exterior</mark> y la de <mark>renta de personas naturales no residentes</mark>.</p>
        <p><mark>Regla clave</mark>: los obligados a tener IFE que presenten por un medio diferente tienen sus declaraciones por <b>no presentadas</b>.</p>` },
      { h: "Instrumento de Firma Electrónica (IFE)", html: `
        <p>Permite formalizar transacciones electrónicamente para cumplir obligaciones ante la DIAN.</p>
        <ul>
          <li><b>Vigencia de 3 años</b> desde su generación; se renueva totalmente en línea, antes o después del vencimiento, sin restricción.</li>
          <li>Lo solicitan: personas naturales obligadas a cumplir deberes formales <b>a nombre propio o de un tercero</b> (representante legal, apoderado, revisor fiscal o contador), según la Res. 12761 de 2011; quienes hacen <b>operaciones aduaneras</b>; quienes piden <b>autorización de numeración de facturación</b>; y los <b>voluntarios</b>.</li>
        </ul>
        <p><b>Pasos para obtener el IFE</b> (esquema “Ruta del IFE”):</p>
        <ol>
          <li>Ingresar a dian.gov.co.</li>
          <li>Entrar por el ícono transaccional “Usuario nuevo”.</li>
          <li>Digitar número y fecha de expedición del documento de identidad.</li>
          <li>Asignar y confirmar la contraseña.</li>
          <li>Iniciar sesión: transaccional, a nombre propio, documento y contraseña.</li>
          <li>Generar firma: datos, código de verificación al <b>correo del RUT</b>, contraseña de la firma, aceptar condiciones y mensaje “firma registrada exitosamente”.</li>
        </ol>
        <p>Criterios de contraseña del usuario según el módulo: longitud mínima 6; al menos 1 numérico y 1 especial; límite de 5 caracteres repetidos; mínimo 2 caracteres distintos de la contraseña anterior.</p>
        <p><b>Tres claves que debe recordar el usuario</b>: <mark>la del correo registrado en el RUT, la del usuario registrado en la DIAN y la del IFE</mark>.</p>` },
      { h: "APP DIAN", html: `
        <p>Aplicación móvil que permite, entre otros: estado de devoluciones; RUT con código QR; estado de obligaciones; factura electrónica con código QR; responsabilidad como facturador; vencimientos; información reportada por terceros; actualizar correo y teléfonos del RUT; cambiar contraseña; inscripción en el RUT; <b>generar firma electrónica</b>; régimen SIMPLE; registro de notificaciones electrónicas; consultas, conceptos jurídicos, call center y <b>PQSRD</b>.</p>
        <p>Declaraciones que se diligencian y presentan en la APP: <mark>210</mark> renta personas naturales, <mark>2593</mark> recibo de anticipo del SIMPLE y <mark>260</mark> declaración anual consolidada.</p>` }
    ],
    trampas: [
      "Res. 12761 de 2011 = lista TAXATIVA de obligados a presentar virtualmente.",
      "Res. 000080 de 2020 = “suscriptores” y opción VOLUNTARIA para no obligados.",
      "Obligado al IFE que presenta por otro medio = declaración NO PRESENTADA.",
      "IFE: vigencia de 3 AÑOS; se renueva en línea antes o después del vencimiento.",
      "El código para generar la firma llega al CORREO REGISTRADO EN EL RUT.",
      "Usuario registrado que presenta litográfica lleva ORIGINAL Y COPIA al banco.",
      "Solo virtuales (ejemplos del módulo): GMF, activos en el exterior, renta de personas naturales no residentes."
    ]
  },
  /* ---------------- TEMA 6 ---------------- */
  {
    id: "t6", short: "Pago presencial y electrónico",
    title: "Pago por canales electrónicos y presenciales: requisitos, formas de pago y horarios",
    sintesis: `Para pagar por el canal virtual se requiere estar inscrito en el RUT y ser usuario registrado. El pago se entiende hecho cuando los valores ingresan a la DIAN o a los bancos autorizados (art. 803 ET). Cuando el pago se hace con títulos (TIDIS, bonos, certificados) se debe usar el canal presencial.`,
    diagrams: ["pago"],
    blocks: [
      { h: "Requisitos del pago virtual", html: `
        <ul>
          <li>Inscripción en el <b>RUT</b> y cuenta de <b>usuario registrado</b>.</li>
          <li>Que el <b>valor liquidado sea mayor a cero</b>.</li>
          <li>Que, tratándose de declaraciones, el valor a pagar se diligencie en cero en la declaración para pagar con los <b>recibos de pago</b> (490 o 690).</li>
          <li>Que el usuario tenga <b>convenio con la entidad financiera autorizada</b> para pagar en línea.</li>
        </ul>
        <p><mark>No se puede usar el canal virtual</mark> cuando el pago requiera <b>TIDIS, bonos, certificados y demás títulos</b>: en esos casos se usa el canal presencial.</p>` },
      { h: "Fecha y formas de pago (art. 803 ET)", html: `
        <blockquote>La fecha de pago es aquella en que los valores imputables <b>hayan ingresado a las oficinas de Impuestos Nacionales o a los bancos autorizados</b>, aun cuando se hayan recibido inicialmente como simples depósitos, buenas cuentas, retenciones en la fuente o resulten como saldos a favor por cualquier concepto.</blockquote>
        <p>De ahí salen tres formas de pago:</p>
        <ul>
          <li>Dineros que ingresan a la DIAN o a los bancos autorizados.</li>
          <li><b>Retenciones en la fuente</b>.</li>
          <li><b>Saldos a favor</b> por cualquier concepto.</li>
        </ul>
        <p>Leyes especiales agregaron otras: <b>cruce de cuentas</b> (Ley 1607 de 2012) y <b>obras por impuestos</b> (Ley 1819 de 2016).</p>` },
      { h: "Canal presencial de pago", html: `
        <p>La presencia física del deudor es indispensable. Ocurre cuando:</p>
        <ul>
          <li>Paga en oficinas de entidades autorizadas con <b>efectivo, cheque, tarjeta de crédito</b> u otro dispositivo de la oficina.</li>
          <li>Paga con <b>TIDIS, bonos, certificados</b> y demás títulos aceptados.</li>
          <li>Pide <b>compensación de saldos</b> ante la DIAN.</li>
        </ul>` },
      { h: "Canal electrónico de pago", html: `
        <p>No requiere presencia física. Ocurre cuando el obligado:</p>
        <ul>
          <li>Paga por <b>medios virtuales</b>.</li>
          <li><b>Imputa saldos a favor</b> del período anterior en la declaración del período siguiente, con IFE.</li>
          <li>Paga con <b>retenciones en la fuente certificadas</b>, presentando la declaración con IFE.</li>
        </ul>
        <div class="nota">Ojo con la diferencia: <b>compensación</b> de saldos (se pide ante la DIAN) = canal presencial; <b>imputación</b> de saldos en la siguiente declaración = canal electrónico.</div>` },
      { h: "Horarios de las entidades recaudadoras", html: `
        <p>Normalmente se recauda en los horarios ordinarios de atención fijados por la <b>Superintendencia Financiera</b>.</p>
        <p><b>Circular Externa 029 de 2014 SFC</b> (Parte I, Título II, Capítulo 1, numeral 4.1): cada entidad <mark>define libremente sus horarios</mark>, que <b>no tienen que estar unificados</b> entre establecimientos de una misma localidad.</p>
        <p>Regla DIAN: si la entidad tiene <b>horarios especiales, adicionales o extendidos</b>, debe recaudar en ellos, y el pago se entiende realizado en la <mark>fecha calendario de la transacción</mark>.</p>` }

  /* ---------------- TEMA 7 ---------------- */
  {
    id: "t7", short: "Cruce de cuentas y obras por impuestos",
    title: "Otros medios de pago sin situación de recursos: cruce de cuentas y obras por impuestos",
    sintesis: `Son medios de pago que, por lo general, no implican movimiento de dinero hacia la DIAN. En el cruce de cuentas el deudor fiscal que es acreedor del Estado compensa su deuda; en obras por impuestos el contribuyente paga parte de su renta ejecutando proyectos en municipios ZOMAC o PDET.`,
    diagrams: ["obras", "normativa"],
    blocks: [
      { h: "Cruce de cuentas (art. 196 Ley 1607 de 2012)", html: `
        <p>El <b>acreedor de una entidad estatal del orden nacional que forme parte del Presupuesto General de la Nación</b> puede pagar por cruce de cuentas los tributos nacionales administrados por la DIAN, con cargo a la deuda a su favor en esa entidad.</p>
        <ul>
          <li>El crédito contra la entidad puede ser <b>por cualquier concepto</b>, siempre que la obligación sea <mark>clara, expresa y exigible</mark> y tenga como causa un <b>mandato legal</b>.</li>
          <li>Requiere <b>apropiación en el Presupuesto General de la Nación</b> y ceñirse al <mark>PAC</mark> (Plan Anual de Caja, en el módulo “Plan Anual de Cuentas”) comunicado por la Dirección General de Crédito Público y Tesoro Nacional, para evitar desequilibrios.</li>
          <li>Reglamentado en el <b>Decreto 1625 de 2016</b> (DUR tributario), arts. <b>1.6.2.2.1 a 1.6.2.2.6</b>.</li>
          <li>Entidades: las del <b>art. 36 del Estatuto Orgánico del Presupuesto</b>.</li>
        </ul>
        <div class="nota">PAC significa Programa Anual Mensualizado de Caja en el Estatuto Orgánico del Presupuesto. El módulo lo llama “Plan Anual de Cuentas”; la sigla es la que importa.</div>` },
      { h: "Obras por impuestos: modalidad fiducia (art. 238 Ley 1819 de 2016)", html: `
        <p>Las <b>personas jurídicas</b> contribuyentes de renta con <mark>ingresos brutos iguales o superiores a 33.610 UVT</mark> pueden pagar hasta el <mark>50 % del impuesto a cargo</mark> de su declaración de renta invirtiendo directamente en proyectos viabilizados y prioritarios en municipios <b>ZOMAC</b> (Zonas Más Afectadas por el Conflicto Armado).</p>
        <ul>
          <li>Proyectos aprobados por la <b>Agencia para la Renovación del Territorio (ART)</b>, con visto bueno del <b>DNP</b>.</li>
          <li>Sectores originales: agua potable, alcantarillado, energía, salud pública, educación pública y vías.</li>
          <li>Reglamentación citada: Decretos <b>1915 de 2017</b> y <b>2469 de 2018</b>.</li>
          <li>Recursos <b>tributarios</b>; contratación por <b>licitación privada abierta</b>; se constituye una <b>fiducia</b>.</li>
          <li>Cierre: la entidad nacional competente (ENC) certifica el recibo a satisfacción y la <mark>DIAN extingue la obligación tributaria</mark>.</li>
        </ul>` },
      { h: "Obras por impuestos: modalidad convenio (art. 800-1 ET, Ley 2010 de 2019)", html: `
        <p>Contribuyentes de renta, <b>personas naturales o jurídicas obligadas a llevar contabilidad</b>, con ingresos brutos ≥ <b>33.610 UVT</b> en el año anterior, pueden celebrar <b>convenios con entidades públicas del nivel nacional</b> y reciben a cambio <mark>Títulos para la Renovación del Territorio (TRT)</mark>.</p>
        <ul>
          <li>Reglamentación citada: <b>Decreto 1147 de 2020</b>.</li>
          <li>Recursos <b>propios</b>; contratación <b>directa</b> bajo el régimen jurídico del contribuyente.</li>
          <li>Cierre: la ENC certifica y la DIAN realiza el proceso para <b>entregar los TRT</b>.</li>
        </ul>
        <p><b>TRT</b>: emitidos por el <b>Ministerio de Hacienda</b>, negociables, computan dentro de las metas de recaudo de la DIAN y sirven a su tenedor para pagar <mark>hasta el 50 % del impuesto de renta</mark>.</p>
        <p><b>Ley 2277 de 2022</b>: el mecanismo es aplicable en territorios PDET y ZOMAC del <b>Distrito de Buenaventura</b>, cumpliendo requisitos y sin autorización del Ministerio.</p>` },
      { h: "Dónde y en qué se puede invertir", html: `
        <p><b>Dónde</b>: municipios <mark>PDET o ZOMAC</mark>. Cifras PDET de la ART citadas: <b>16 subregiones y 170 municipios</b>; 6,6 millones de personas; 2,5 millones de víctimas; 24 % de la población rural; 57 % de población rural en pobreza multidimensional; 36 % del territorio; 45 % del área de parques nacionales.</p>
        <p><b>En qué</b> (Figura 12): agua potable y saneamiento básico, energía, salud, educación, infraestructura (varias modalidades, incluida la deportiva), bienes públicos, pago por servicios ambientales, TIC, adaptación al cambio climático y gestión del riesgo.</p>` },
      { h: "Glosario del módulo aplicado", html: `
        <p><b>Obligaciones fiscales</b>: obligaciones claras, expresas y exigibles, contenidas en títulos ejecutivos: declaraciones y sus correcciones, liquidaciones oficiales ejecutoriadas, demás actos ejecutoriados que fijen sumas líquidas, garantías y cauciones (desde la ejecutoria del acto de incumplimiento) y providencias judiciales ejecutoriadas.</p>
        <p><b>Apropiaciones</b>: autorizaciones máximas de gasto que aprueba el Congreso para la vigencia fiscal.</p>` }
    ],
    trampas: [
      "Cruce de cuentas: art. 196 Ley 1607 de 2012; reglamento DUR 1625/16, arts. 1.6.2.2.1 a 1.6.2.2.6.",
      "El crédito contra el Estado puede ser por CUALQUIER concepto, pero claro, expreso, exigible y con causa en mandato legal.",
      "Obras por impuestos: ingresos ≥ 33.610 UVT y hasta el 50 % del impuesto a cargo de RENTA.",
      "Modalidad fiducia (Ley 1819, art. 238): solo PERSONAS JURÍDICAS; la DIAN EXTINGUE la obligación.",
      "Modalidad convenio (art. 800-1, Ley 2010): personas naturales o jurídicas con contabilidad; la DIAN ENTREGA TRT.",
      "Los TRT los emite el MINISTERIO DE HACIENDA, no la DIAN."
    ]
  }
  ],

  cards: [
    ["t1","¿En qué dos tipos se dividen los documentos del sistema DIAN?","Privados (los producen los particulares) y administrativos y judiciales (los produce la autoridad competente)."],
    ["t1","¿Por qué la declaración tributaria es un documento privado?","No proviene de un funcionario en ejercicio, no es autorizada por este ni otorgada ante notario."],
    ["t1","¿Qué establece el art. 746 ET?","Presunción de veracidad: se tienen por ciertos los hechos de declaraciones, correcciones y respuestas a requerimientos, salvo comprobación especial solicitada o exigida por la ley."],
    ["t1","¿Cuándo se invierte la carga de la prueba según el CE (exp. 20547, 2016)?","Automáticamente cuando la DIAN solicita una comprobación especial o la ley la exige."],
    ["t1","Clasificación de declaraciones por materia y por contenido","Materia: tributarias, aduaneras, cambiarias. Contenido: declarativas e informativas."],
    ["t1","¿Cuáles son las declaraciones informativas citadas?","120 precios de transferencia, 160 activos en el exterior, 260 anual consolidada."],
    ["t1","Litográfica vs electrónica","Litográfica: se presenta en bancos y entidades autorizadas. Electrónica: sistema DIAN con instrumento de firma electrónica."],
    ["t1","Tres requisitos de todo formulario","Prescrito por resolución, con los requisitos mínimos de la ley o decreto y con instrucciones de diligenciamiento."],
    ["t1","Formulario 110","Renta de personas jurídicas y asimiladas, personas naturales no residentes y sucesiones ilíquidas de causantes no residentes, o de ingresos y patrimonio."],
    ["t1","Formulario 210","Renta de personas naturales residentes y sucesiones ilíquidas de causantes residentes."],
    ["t1","Formularios 300, 310, 325 y 350","300 IVA; 310 impuesto nacional al consumo; 325 IVA de prestadores de servicios desde el exterior; 350 retención en la fuente."],
    ["t1","Formularios 410, 420, 430 y 435","410 GMF semanal; 420 patrimonio; 430 gasolina y ACPM; 435 carbono."],
    ["t1","¿Qué es el formulario 400?","Formulario para liquidar y consignar el aporte especial de las notarías para la administración de justicia."],
    ["t1","¿Cuáles formularios son de clase cambiaria?","532, 534 y 536."],
    ["t1","¿Qué resolución prescribió el formulario 300 para 2020 y siguientes?","Resolución 00019 del 10 de marzo de 2020."],
    ["t1","¿Quién usa el formulario 532 y desde qué monto?","Personas y empresas de transporte de valores que ingresen o saquen efectivo por modalidad diferente a viajeros, por más de US$10.000."],
    ["t1","¿Cómo se presenta el formulario 532?","Se diligencia en los Servicios Informáticos Electrónicos, se imprime y se presenta ante las autoridades aduaneras. En contingencia, diligenciamiento manual."],
    ["t1","¿Quién exige el formulario 536 y en qué rango?","Profesionales de compra y venta de divisas en zonas de frontera, en operaciones mayores a US$200 y menores a US$500."],
    ["t1","¿Qué deber tiene el profesional de cambio con el 536?","Numerarlos de forma consecutiva anual y conservar el original para exhibirlo a la autoridad."],
    ["t2","¿Quiénes usan el formulario 490?","Personas naturales o jurídicas responsables principales, solidarias o subsidiarias que paguen impuestos nacionales de cualquier año gravable."],
    ["t2","¿Para qué no sirve el 490?","Para tributos aduaneros ni obligaciones cambiarias."],
    ["t2","¿Para qué sirve el formulario 690?","Pago de tributos aduaneros y sanciones cambiarias."],
    ["t2","¿Para qué sirve el código de concepto del recibo?","Para asociar el pago a “la obligación financiera” en el sistema informático."],
    ["t2","Códigos de IVA en el 490","05 bimestral (6), 57 cuatrimestral (3), 58 anual (1)."],
    ["t2","Código 04 y código 07","04 renta; 07 sanción independiente."],
    ["t2","Código 99 y su periodicidad","GMF, semanal, 53 períodos."],
    ["t2","Códigos 61 a 64","Retención y autorretención renta, retención IVA, retención timbre y retención CREE; mensuales."],
    ["t2","Código 27 y código 54","27 impuesto unificado del régimen SIMPLE; 54 impuesto al patrimonio."],
    ["t2","Código 08","Pago de retenciones que no requieren declaración (venta de activos fijos, pagos por ganancia ocasional)."],
    ["t2","¿Qué gravamen de viajeros se paga con el 690?","El gravamen único ad valorem de viajeros procedentes de Maicao, Uribia y Manaure."],
    ["t2","¿Qué títulos se mencionan para pagar tributos aduaneros con el 690?","CERT, TIDIS, CDTUR, bonos de financiamiento presupuestal y títulos judiciales."],
    ["t2","¿Qué sanciones cambiarias se pagan con el 690?","Las propuestas e impuestas dentro de los procesos administrativos cambiarios."],
    ["t3","¿Desde cuándo presta mérito ejecutivo una garantía (art. 828-4)?","Desde la ejecutoria del acto que declara el incumplimiento o la exigibilidad de las obligaciones garantizadas."],
    ["t3","Características del seguro según el módulo","Solemne, bilateral, oneroso, aleatorio y de ejecución sucesiva (art. 1036 C. Co.). Norma vigente: consensual (Ley 389 de 1997)."],
    ["t3","Plazo para entregar la póliza al tomador","15 días siguientes a su expedición (art. 1046 C. Co.)."],
    ["t3","¿Qué dice el art. 814-2 ET?","El garante tiene 10 días desde la ejecutoria de la resolución que deja sin efecto la facilidad para pagar; si no, mandamiento de pago con embargo y secuestro."],
    ["t3","¿Qué dijo el CE en el exp. 19710 de 2014?","La ejecutoria del acto que deja sin vigencia la facilidad convierte las garantías en título ejecutivo; no se exige acto previo de aceptación de la garantía."],
    ["t3","Características de las garantías aduaneras","Requieren aceptación o certificación DIAN, son irrevocables, vigentes mientras dure el objeto, a favor de la Nación-DIAN, con renuncia al beneficio de excusión."],
    ["t3","¿Qué pasa si la garantía aduanera no alcanza?","El saldo insoluto se hace efectivo sobre el patrimonio del deudor, prenda general de los acreedores (art. 28 D. 1165/19)."],
    ["t3","Garantía global","Ampara varias operaciones de un mismo responsable; con ella vigente no se requieren específicas, salvo en reemplazo de medida cautelar."],
    ["t3","Garantía específica","Ampara una sola operación o trámite aduanero (art. 29 D. 1165/19)."],
    ["t3","Garantía de pleno derecho","Garantía real, solo para tránsito aduanero comunitario, sobre el medio de transporte o unidades de carga registrados."],
    ["t3","Garantía en devoluciones (art. 860)","Bancaria o de seguros, a favor de la Nación, por el monto a devolver más las sanciones del art. 670."],
    ["t3","¿Qué responsabilidad asume el garante según la sentencia 22679 de 2020?","Responsable solidario por el saldo devuelto improcedentemente, intereses moratorios y sanciones."],
    ["t4","Actos de la DIAN que se convierten en títulos ejecutivos","Liquidaciones oficiales, resoluciones sanción y resoluciones que resuelven recursos."],
    ["t4","¿Qué es una liquidación oficial?","Acto definitivo por el que la administración determina o revisa impuestos e impone sanciones."],
    ["t4","Clases de liquidación oficial","Aforo, revisión, corrección aritmética y provisional."],
    ["t4","Recursos mencionados","Reconsideración, reposición y apelación."],
    ["t4","Requisitos de la sentencia como título","Sentencia de condena con constancia de ejecutoria que contenga obligación clara, expresa y exigible no sometida a plazo o condición (art. 114-2 CGP)."],
    ["t5","¿Qué dos factores determinan el canal de presentación?","El sujeto y el tipo de declaración."],
    ["t5","¿Cuándo se usa el canal presencial?","Cuando no se está obligado a presentar virtualmente o hay contingencia en los sistemas DIAN."],
    ["t5","¿Qué contiene la Resolución 12761 de 2011?","La lista taxativa de sujetos obligados a presentar virtualmente con IFE."],
    ["t5","¿Qué hizo la Resolución 000080 de 2020?","Habilitó el IFE para todos los que quieran presentar virtualmente y los llama “suscriptores”."],
    ["t5","Consecuencia de no usar el canal virtual estando obligado","Las declaraciones se tienen por no presentadas."],
    ["t5","Tres opciones para generar la declaración litográfica","Usuario no registrado, usuario nuevo y usuario registrado."],
    ["t5","Declaraciones que solo se presentan virtualmente (ejemplos)","GMF, activos en el exterior y renta de personas naturales no residentes."],
    ["t5","Vigencia del IFE","3 años desde su generación; se renueva en línea antes o después del vencimiento."],
    ["t5","¿Quiénes solicitan IFE?","Personas naturales obligadas a nombre propio o de terceros (representante, apoderado, revisor fiscal, contador); quienes hacen operaciones aduaneras; quienes piden numeración de facturación; voluntarios."],
    ["t5","¿A dónde llega el código para generar la firma?","Al correo electrónico registrado en el RUT."],
    ["t5","Tres claves del usuario virtual","Correo registrado en el RUT, usuario registrado DIAN e IFE."],
    ["t5","Declaraciones que se presentan en la APP DIAN","210 renta personas naturales, 2593 recibo de anticipo del SIMPLE y 260 anual consolidada."],
    ["t6","Requisitos para pagar virtualmente","RUT y usuario registrado, valor mayor a cero y convenio con entidad financiera autorizada."],
    ["t6","¿Cuándo no se puede usar el canal virtual de pago?","Cuando se paga con TIDIS, bonos, certificados y demás títulos."],
    ["t6","¿Cuál es la fecha de pago según el art. 803 ET?","Aquella en que los valores ingresan a las oficinas de la DIAN o a los bancos autorizados."],

/* ===================== ESTADO ===================== */
const KEY = "dian2676-estudio-v1";
let S = { done:{}, cards:{}, quiz:{}, prac:{}, theme:null };
try { const raw = localStorage.getItem(KEY); if (raw) S = Object.assign(S, JSON.parse(raw)); } catch(e) {}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e) {} }
const ensure = (o,k) => (o[k] = o[k] || {});
if (S.theme) document.documentElement.setAttribute("data-theme", S.theme);

function progress(m){
  const d = ensure(S.done, m.id), c = ensure(S.cards, m.id), q = ensure(S.quiz, m.id);
  const temas = m.temas.filter(t => d[t.id]).length / m.temas.length;
  const known = Object.values(c).filter(v => v === "know").length / m.cards.length;
  const qz = (q.best || 0) / 100;
  return { pct: Math.round((temas*0.4 + known*0.3 + qz*0.3) * 100), temas: m.temas.filter(t=>d[t.id]).length, known: Object.values(c).filter(v=>v==="know").length, best: q.best || 0 };
}

/* ===================== UTILIDADES ===================== */
const $ = s => document.querySelector(s);
const shuffle = a => { a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const strip = s => String(s).replace(/<[^>]+>/g, "");
const temaName = (m, id) => (m.temas.find(t => t.id === id) || {}).short || "";

const SECTIONS = [
  ["", "Ruta del módulo", m => ""],
  ["temas", "Lectura por temas", m => m.temas.length],
  ["esquemas", "Esquemas y flujogramas", m => Object.keys(m.diagrams).length],
  ["memo", "Mnemotecnias", m => m.memos.length],
  ["fichas", "Memofichas", m => m.cards.length],
  ["quiz", "Quiz", m => m.quiz.length],
  ["practica", "Práctica activa", m => m.practicas.length],
  ["glosario", "Glosario", m => m.glosario.length],
  ["normas", "Normas y sentencias", m => m.normas.length]
];

/* ===================== ROUTER ===================== */
let current = { mod: null, sec: "" };
function parse(){
  const h = (location.hash || "").replace(/^#/, "");
  if (!h || h === "inicio") return { mod: null, sec: "inicio" };
  const [mid, ...rest] = h.split("-");
  const mod = MODULES.find(m => m.id === mid);
  if (!mod) return { mod: null, sec: "inicio" };
  return { mod, sec: rest.join("-") };
}
function go(token){ if (location.hash.replace("#","") === token) render(); else location.hash = token; }
window.addEventListener("hashchange", render);

function render(){
  current = parse();
  renderSide(); renderTop();
  const at = document.querySelector('#tabs a[aria-current="page"]'); if (at) at.scrollIntoView({ inline: "center", block: "nearest" });
  const v = $("#view");
  const { mod, sec } = current;
  if (!mod) v.innerHTML = viewHome();
  else if (sec === "") v.innerHTML = viewRuta(mod);
  else if (/^t\d+$/.test(sec)) v.innerHTML = viewTema(mod, sec);
  else if (sec === "temas") v.innerHTML = viewTema(mod, mod.temas[0].id);
  else if (sec === "esquemas") v.innerHTML = viewEsquemas(mod);
  else if (sec === "memo") v.innerHTML = viewMemo(mod);
  else if (sec === "fichas") { v.innerHTML = viewFichasShell(mod); initFichas(mod); }
  else if (sec === "quiz") { v.innerHTML = viewQuizHome(mod); }
  else if (sec === "practica") { v.innerHTML = viewPracticaHome(mod); }
  else if (sec === "glosario") { v.innerHTML = viewGlosario(mod); initGlosario(mod); }
  else if (sec === "normas") { v.innerHTML = viewNormas(mod); initNormas(mod); }
  else v.innerHTML = viewRuta(mod);
  v.insertAdjacentHTML("beforeend", FOOTER);
  window.scrollTo(0, 0);
}

/* ===================== NAVEGACIÓN ===================== */
function renderSide(){
  const m = current.mod || MODULES[0];
  const p = progress(m);
  const secKey = /^t\d+$/.test(current.sec) ? "temas" : current.sec;
  $("#side").innerHTML = `
    <a class="brand" href="#inicio"><div class="seal">2676</div><div><b>Concurso DIAN</b><span>Proceso 2676 de 2026</span></div></a>
    <h4>Módulos</h4>
    ${MODULES.map(x => `<button class="modbtn" aria-current="${current.mod && current.mod.id===x.id}" onclick="go('${x.id}')"><span class="n">${x.n}</span><span>${x.title}<small>${progress(x).pct} % completado</small></span></button>`).join("")}
    ${PENDING.map(x => `<div class="modbtn pending"><span class="n">${x.n}</span><span>${x.title}<small>${x.note}</small></span></div>`).join("")}
    ${current.mod ? `<h4>Módulo ${m.n}</h4>
    <nav class="sections">${SECTIONS.map(([k,l,c]) => `<a href="#${m.id}${k?"-"+k:""}" ${secKey===k?'aria-current="page"':""}>${l}<span class="cnt">${c(m)}</span></a>`).join("")}</nav>
    <div class="prog"><p><b>${p.pct} %</b> de dominio</p><div class="bar"><i style="width:${p.pct}%"></i></div>
    <p>${p.temas}/${m.temas.length} temas · ${p.known}/${m.cards.length} fichas · quiz ${p.best} %</p></div>` : ""}
    <button class="themebtn" onclick="toggleTheme()">Cambiar tema claro/oscuro</button>
    <div class="sidecredit">Creado por <b>Fabián Andrés Correa Páez</b><br>Solo para fines educativos y del concurso.</div>`;
}
function renderTop(){
  const m = current.mod;
  const secKey = /^t\d+$/.test(current.sec) ? "temas" : current.sec;
  $("#topbar").innerHTML = `<div class="tb1"><a href="#inicio" style="text-decoration:none;color:inherit"><b>Concurso DIAN 2676</b></a>
    ${m ? `<span class="pill">Módulo ${m.n} · ${progress(m).pct} %</span>` : `<button class="themebtn" style="margin:0" onclick="toggleTheme()">Tema</button>`}</div>
    ${m ? `<div class="tabs" id="tabs">${SECTIONS.map(([k,l]) => `<a href="#${m.id}${k?"-"+k:""}" ${secKey===k?'aria-current="page"':""}>${l}</a>`).join("")}</div>` : `<div style="height:10px"></div>`}`;
}
function toggleTheme(){
  const dark = getComputedStyle(document.documentElement).getPropertyValue("color-scheme").trim() === "dark";
  S.theme = dark ? "light" : "dark"; document.documentElement.setAttribute("data-theme", S.theme); save();
}

/* ===================== VISTAS ===================== */
function viewHome(){
  return `<section class="hero">
    <div class="kicker">Proceso de selección 2676 de 2026 · Creado por Fabián Andrés Correa Páez</div>
    <h1><span class="swipe">Estudia la DIAN</span> módulo por módulo</h1>
