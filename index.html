  </section>
  <h2 style="margin-top:0">Tus módulos</h2>
  <ol class="route">
    ${MODULES.map(m => { const p = progress(m); return `<li><div class="num">${m.n}</div><div><h3>${m.title}</h3><p>${m.course} · ${m.temas.length} temas · ${m.quiz.length} preguntas · ${m.cards.length} fichas</p><div class="bar" style="max-width:320px"><i style="width:${p.pct}%"></i></div></div><a class="btn small" href="#${m.id}">${p.pct ? "Continuar" : "Empezar"}</a></li>`; }).join("")}
    ${PENDING.map(x => `<li style="opacity:.6"><div class="num">${x.n}</div><div><h3>${x.title}</h3><p>${x.note}.</p></div></li>`).join("")}
  </ol>
  <h2>Método sugerido por sesión</h2>
  <div class="prose"><ol>
    <li><b>Lee un tema</b> y abre cada bloque; los términos resaltados son los que más se preguntan.</li>
    <li><b>Mira sus esquemas</b> y explica el flujograma en voz alta sin mirar.</li>
    <li><b>Memoriza con las mnemotecnias</b> las listas cerradas (elementos, valores, pilares).</li>
    <li><b>Repasa las memofichas</b>; marca “Repasar” lo que dudes y vuelve a esas al día siguiente.</li>
    <li><b>Haz el quiz del tema</b> y luego el simulacro mixto. Repite el modo “Mis errores” hasta dejarlo en cero.</li>
  </ol></div>`;
}

function viewRuta(m){
  const p = progress(m), d = ensure(S.done, m.id);
  return `<section class="hero">
    <div class="kicker">Módulo ${m.n} · ${m.course}</div>
    <h1><span class="swipe">${m.title}</span></h1>
    <p class="lead" style="margin-top:16px">${m.presentacion}</p>
    <div class="meta"><span class="pill">${m.pages} páginas de fuente</span><span class="pill">${m.temas.length} temas</span><span class="pill">${Object.keys(m.diagrams).length} esquemas</span><span class="pill">${m.quiz.length} preguntas</span><span class="pill">${m.cards.length} memofichas</span></div>
  </section>
  <div class="sintesis"><b>Objetivo del módulo</b><div class="prose" style="font-size:16.5px">${m.objetivo}</div></div>
  <h2>Ruta de estudio</h2>
  <ol class="route">
    ${m.temas.map((t,i) => `<li><div class="num">${i+1}</div><div><h3><a href="#${m.id}-${t.id}" style="color:inherit;text-decoration:none">${t.short}</a></h3><p>${t.title}</p></div>${d[t.id] ? `<span class="done">✓ Estudiado</span>` : `<a class="btn ghost small" href="#${m.id}-${t.id}">Leer</a>`}</li>`).join("")}
  </ol>
  <h2>Objetivos específicos</h2>
  <div class="prose"><ul>${m.objetivos.map(o=>`<li>${o}</li>`).join("")}</ul></div>
  <h2>Tu avance</h2>
  <div class="grid2">
    <div class="cell"><h4>${p.temas} de ${m.temas.length}</h4><p>temas marcados como estudiados</p></div>
    <div class="cell"><h4>${p.known} de ${m.cards.length}</h4><p>memofichas dominadas</p></div>
    <div class="cell"><h4>${p.best} %</h4><p>mejor resultado en quiz</p></div>
  </div>`;
}

function viewTema(m, tid){
  const t = m.temas.find(x => x.id === tid) || m.temas[0];
  const idx = m.temas.indexOf(t), d = ensure(S.done, m.id);
  const prev = m.temas[idx-1], next = m.temas[idx+1];
  return `<div class="temanav">${m.temas.map((x,i)=>`<a href="#${m.id}-${x.id}" aria-current="${x.id===t.id}">${i+1}. ${x.short}</a>`).join("")}</div>
  <div class="kicker">Tema ${idx+1} de ${m.temas.length}</div>
  <h1 style="font-size:clamp(26px,3.4vw,36px)">${t.title}</h1>
  <div class="sintesis"><b>Síntesis</b><div class="prose" style="font-size:16.5px">${t.sintesis}</div></div>
  <div class="row" style="margin:12px 0 10px"><button class="btn ghost small" onclick="toggleAll(true)">Abrir todo</button><button class="btn ghost small" onclick="toggleAll(false)">Cerrar todo</button></div>
  ${t.blocks.map((b,i) => `<details class="block" ${i===0?"open":""}><summary>${b.h}</summary><div class="prose">${b.html}</div></details>`).join("")}
  <div class="trampas"><h3>Trampas frecuentes de examen</h3><ul>${t.trampas.map(x=>`<li>${x}</li>`).join("")}</ul></div>
  <h2>Esquemas de este tema</h2>
  ${t.diagrams.map(k => diagHTML(m, k)).join("")}
  <div class="markdone"><div><b style="font-family:var(--serif);font-size:18px">${d[t.id] ? "Tema marcado como estudiado" : "¿Terminaste la lectura?"}</b><div class="muted" style="font-size:14px">Luego practica con el quiz de este tema.</div></div>
    <div class="row"><button class="btn ${d[t.id]?"ghost":""}" onclick="markDone('${m.id}','${t.id}')">${d[t.id] ? "Desmarcar" : "Marcar como estudiado"}</button>
    <button class="btn ghost" onclick="startQuiz('${m.id}','tema','${t.id}')">Quiz del tema</button></div></div>
  <div class="row" style="justify-content:space-between;margin-top:22px">
    ${prev ? `<a class="btn ghost" href="#${m.id}-${prev.id}">← ${prev.short}</a>` : "<span></span>"}
    ${next ? `<a class="btn ghost" href="#${m.id}-${next.id}">${next.short} →</a>` : `<a class="btn ghost" href="#${m.id}-quiz">Ir al quiz</a>`}
  </div>`;
}
function toggleAll(open){ document.querySelectorAll("details.block").forEach(d => d.open = open); }
function markDone(mid, tid){ const d = ensure(S.done, mid); d[tid] = !d[tid]; save(); render(); }
function diagHTML(m, k){ const d = m.diagrams[k]; return `<section class="diag" id="d-${k}"><h3>${d.title}</h3><p>${d.desc}</p>${d.html()}</section>`; }

function viewEsquemas(m){
  const keys = Object.keys(m.diagrams);
  return `<div class="kicker">Módulo ${m.n}</div><h1>Esquemas y flujogramas</h1>
  <p class="lead" style="margin:14px 0 22px">Explica cada esquema en voz alta sin mirar. Si puedes reconstruirlo en una hoja, lo dominas.</p>
  <div class="diag-index">${keys.map(k => `<a href="javascript:void(0)" onclick="document.getElementById('d-${k}').scrollIntoView({behavior:'smooth'})">${m.diagrams[k].title}<small>${temaName(m, m.diagrams[k].t)}</small></a>`).join("")}</div>
  ${keys.map(k => diagHTML(m, k)).join("")}`;
}

function viewMemo(m){
  return `<div class="kicker">Módulo ${m.n}</div><h1>Mnemotecnias</h1>
  <p class="lead" style="margin:14px 0 22px">Para las listas cerradas que el examen pide completas. Lee la frase, tapa las letras y reconstruye cada término.</p>
  <div class="fc-tools"><label for="mfilter">Tema</label><select id="mfilter" onchange="filterMemo(this.value)"><option value="">Todos</option>${m.temas.map(t=>`<option value="${t.id}">${t.short}</option>`).join("")}</select>
  <button class="btn ghost small" onclick="document.querySelectorAll('.letters').forEach(l=>l.style.visibility=l.style.visibility==='hidden'?'visible':'hidden')">Ocultar o mostrar desglose</button></div>
  <div id="memos">${m.memos.map(x => `<article class="mnemo" data-t="${x.t}"><div class="muted" style="font-size:13px">${temaName(m,x.t)}</div><h3 style="margin:2px 0 0">${x.title}</h3><div class="key">${x.key}</div><div class="phrase">${x.phrase}</div><div class="letters">${x.letters.map(([a,b])=>`<span class="letter"><b>${a}</b>${b}</span>`).join("")}</div>${x.use?`<div class="use">${x.use}</div>`:""}</article>`).join("")}</div>`;
}
function filterMemo(t){ document.querySelectorAll(".mnemo").forEach(e => e.style.display = !t || e.dataset.t === t ? "" : "none"); }

/* ---------- Memofichas ---------- */
let FC = { list: [], i: 0, flipped: false };
function viewFichasShell(m){
  return `<div class="kicker">Módulo ${m.n}</div><h1>Memofichas</h1>
  <p class="lead" style="margin:14px 0 20px">Toca la ficha para voltearla. Teclado: espacio voltea, 1 = Repasar, 2 = La sé, flechas para moverte.</p>
  <div class="fc-tools">
    <select id="fcf" aria-label="Filtrar fichas"><option value="">Todas las fichas</option><option value="again">Solo las que debo repasar</option><option value="new">Solo las no vistas</option>${m.temas.map(t=>`<option value="${t.id}">${t.short}</option>`).join("")}</select>
    <button class="btn ghost small" id="fcshuf">Barajar</button>
    <button class="btn ghost small" id="fcreset">Reiniciar marcas</button>
  </div>
  <div id="fcarea"></div>`;
}
function initFichas(m){
  const build = (doShuffle) => {
    const f = $("#fcf").value, st = ensure(S.cards, m.id);
    let list = m.cards.map((c,i) => ({ i, t:c[0], q:c[1], a:c[2] }));
    if (f === "again") list = list.filter(c => st[c.i] === "again");
    else if (f === "new") list = list.filter(c => !st[c.i]);
    else if (f) list = list.filter(c => c.t === f);
    FC = { list: doShuffle ? shuffle(list) : list, i: 0, flipped: false };
    drawCard(m);
  };
  $("#fcf").onchange = () => build(false);
  $("#fcshuf").onclick = () => build(true);
  $("#fcreset").onclick = () => { S.cards[m.id] = {}; save(); build(false); renderSide(); };
  build(false);
}
function drawCard(m){
  const area = $("#fcarea"); if (!area) return;
  const st = ensure(S.cards, m.id);
  if (!FC.list.length) { area.innerHTML = `<div class="empty">No hay fichas en este filtro. Elige “Todas las fichas” o márcalas mientras repasas.</div>`; return; }
  const c = FC.list[FC.i];
  const known = Object.values(st).filter(v=>v==="know").length;
  area.innerHTML = `<div class="card3d"><div class="card ${FC.flipped?"flip":""}" id="card" tabindex="0" role="button" aria-label="Voltear ficha">
      <div class="face front"><span class="tagline">${temaName(m,c.t)}${st[c.i]?` · ${st[c.i]==="know"?"La sé":"Repasar"}`:""}</span><div class="q">${c.q}</div></div>
      <div class="face back"><span class="tagline">Respuesta</span><div class="a">${c.a}</div></div>
    </div></div>
    <div class="fc-actions">
      <button class="btn ghost" onclick="fcMove(-1)" ${FC.i===0?"disabled":""}>Anterior</button>
      <button class="btn again" onclick="fcMark('again')">Repasar</button>
      <button class="btn know" onclick="fcMark('know')">La sé</button>
      <button class="btn ghost" onclick="fcMove(1)" ${FC.i>=FC.list.length-1?"disabled":""}>Siguiente</button>
    </div>
    <div class="fc-count">Ficha ${FC.i+1} de ${FC.list.length} · Dominadas en el módulo: ${known}/${m.cards.length}</div>`;
  $("#card").onclick = () => { FC.flipped = !FC.flipped; $("#card").classList.toggle("flip"); };
}
function fcMove(d){ const m = current.mod; FC.i = Math.max(0, Math.min(FC.list.length-1, FC.i+d)); FC.flipped = false; drawCard(m); }
function fcMark(v){ const m = current.mod; ensure(S.cards, m.id)[FC.list[FC.i].i] = v; save(); renderSide(); if (FC.i < FC.list.length-1) fcMove(1); else drawCard(m); }
document.addEventListener("keydown", e => {
  if (!current.mod || current.sec !== "fichas" || /input|select|textarea/i.test(e.target.tagName)) return;
  if (e.key === " ") { e.preventDefault(); const c = $("#card"); if (c) c.click(); }
  else if (e.key === "ArrowRight") fcMove(1); else if (e.key === "ArrowLeft") fcMove(-1);
  else if (e.key === "1") fcMark("again"); else if (e.key === "2") fcMark("know");
});

/* ---------- Quiz ---------- */
let QZ = null;
function viewQuizHome(m){
  const q = ensure(S.quiz, m.id), wrong = (q.wrong || []).length;
  return `<div class="kicker">Módulo ${m.n}</div><h1>Quiz</h1>
  <p class="lead" style="margin:14px 0 6px">Cada respuesta muestra la explicación. Las que falles se guardan en “Mis errores”.</p>
  <p class="muted">Mejor resultado en simulacro o quiz completo: <b>${q.best || 0} %</b></p>
  <div class="modes">
    <button class="mode" onclick="startQuiz('${m.id}','sim')"><b>Simulacro mixto</b><span>20 preguntas al azar de todos los temas</span></button>
    <button class="mode" onclick="startQuiz('${m.id}','all')"><b>Banco completo</b><span>Las ${m.quiz.length} preguntas en orden aleatorio</span></button>
    <button class="mode" onclick="startQuiz('${m.id}','err')" ${wrong?"":"disabled"} style="${wrong?"":"opacity:.5"}"><b>Mis errores</b><span>${wrong ? wrong + " preguntas pendientes" : "Sin errores guardados"}</span></button>
  </div>
  <h3>Por tema</h3>
  <div class="modes">${m.temas.map((t,i)=>`<button class="mode" onclick="startQuiz('${m.id}','tema','${t.id}')"><b>${i+1}. ${t.short}</b><span>${m.quiz.filter(x=>x.t===t.id).length} preguntas</span></button>`).join("")}</div>`;
}
function startQuiz(mid, mode, tid){
  const m = MODULES.find(x => x.id === mid);
  if (location.hash !== `#${mid}-quiz`) { history.replaceState(null, "", `#${mid}-quiz`); current = { mod: m, sec: "quiz" }; renderSide(); renderTop(); }
  let pool = m.quiz.map((x,i) => Object.assign({ id:i }, x));
  if (mode === "tema") pool = pool.filter(x => x.t === tid);
  if (mode === "err") { const w = ensure(S.quiz, mid).wrong || []; pool = pool.filter(x => w.includes(x.id)); }
  pool = shuffle(pool); if (mode === "sim") pool = pool.slice(0, 20);
  QZ = { m, mode, tid, items: pool.map(x => { const ord = shuffle(x.o.map((o,k)=>k)); return Object.assign({}, x, { ord }); }), i: 0, ok: 0, answers: [] };
  drawQ(); window.scrollTo(0,0);
}
function drawQ(){
  const v = $("#view"), z = QZ, q = z.items[z.i];
  if (!q) return endQuiz();
  const label = z.mode === "tema" ? temaName(z.m, z.tid) : z.mode === "sim" ? "Simulacro mixto" : z.mode === "err" ? "Mis errores" : "Banco completo";
  v.innerHTML = `<div class="kicker">Quiz · ${label}</div>
  <div class="qprog"><i style="width:${(z.i)/z.items.length*100}%"></i></div>
  <div class="qbox"><div class="qmeta"><span>Pregunta ${z.i+1} de ${z.items.length}</span><span>${temaName(z.m,q.t)} · Aciertos: ${z.ok}</span></div>
  <p class="qtext">${q.q}</p>
  <div class="opts">${q.ord.map((k,j)=>`<button class="opt" data-k="${k}" onclick="answer(${k})"><span class="l">${"ABCD"[j]}</span><span>${q.o[k]}</span></button>`).join("")}</div>
  <div id="fb"></div></div>
  <div class="row" style="margin-top:14px;justify-content:space-between"><button class="btn ghost small" onclick="go('${z.m.id}-quiz')">Salir del quiz</button><span></span></div>`;
}
function answer(k){
  const z = QZ, q = z.items[z.i], right = k === q.a;
  if (right) z.ok++;
  z.answers.push({ q, k, right });
  const st = ensure(S.quiz, z.m.id); st.wrong = st.wrong || [];
  if (!right && !st.wrong.includes(q.id)) st.wrong.push(q.id);
  if (right && z.mode === "err") st.wrong = st.wrong.filter(x => x !== q.id);
  save();
  document.querySelectorAll(".opt").forEach(b => { b.disabled = true; const bk = +b.dataset.k; if (bk === q.a) b.classList.add("right"); else if (bk === k) b.classList.add("wrong"); });
  $("#fb").innerHTML = `<div class="expl"><b style="color:${right?"var(--ok)":"var(--seal)"}">${right ? "Correcto." : "Incorrecto. La respuesta es: " + q.o[q.a]}</b><br>${q.e}</div>
    <div class="row" style="margin-top:14px;justify-content:flex-end"><button class="btn" id="nextq" onclick="QZ.i++;drawQ();window.scrollTo(0,0)">${z.i < z.items.length-1 ? "Siguiente pregunta" : "Ver resultado"}</button></div>`;
  $("#nextq").focus();
}
function endQuiz(){
  const z = QZ, pct = Math.round(z.ok / z.items.length * 100), st = ensure(S.quiz, z.m.id);
  if (z.mode === "sim" || z.mode === "all") st.best = Math.max(st.best || 0, pct);
  st.last = pct; save(); renderSide(); renderTop();
  const wrong = z.answers.filter(a => !a.right);
  const msg = pct >= 85 ? "Dominio sólido. Pasa al siguiente tema o al simulacro." : pct >= 65 ? "Vas bien. Repasa las explicaciones de lo que fallaste y repite “Mis errores”." : "Vuelve a la lectura del tema y a las memofichas antes de repetir.";
  $("#view").innerHTML = `<div class="kicker">Resultado</div>
  <div class="qbox" style="text-align:center"><div class="score">${pct} %</div><p class="lead" style="margin:10px auto 0">${z.ok} de ${z.items.length} correctas. ${msg}</p>
  <div class="row" style="justify-content:center;margin-top:18px"><button class="btn" onclick="startQuiz('${z.m.id}','${z.mode}','${z.tid||""}')">Repetir</button>${(st.wrong||[]).length?`<button class="btn ghost" onclick="startQuiz('${z.m.id}','err')">Practicar mis errores (${st.wrong.length})</button>`:""}<button class="btn ghost" onclick="go('${z.m.id}-quiz')">Otros modos</button></div></div>
  ${wrong.length ? `<h2>Revisa lo que fallaste</h2><ol class="prose review">${wrong.map(a=>`<li><b>${a.q.q}</b><br><span style="color:var(--seal)">Marcaste: ${a.q.o[a.k]}</span><br><span style="color:var(--ok)">Correcta: ${a.q.o[a.q.a]}</span><br><span class="muted">${a.q.e}</span></li>`).join("")}</ol>` : ""}`;
}

/* ---------- Práctica ---------- */
let PR = null;
function viewPracticaHome(m){
  const st = ensure(S.prac, m.id);
  return `<div class="kicker">Módulo ${m.n}</div><h1>Práctica activa</h1>
  <p class="lead" style="margin:14px 0 20px">Clasificar y ordenar obliga a recuperar el concepto, no solo a reconocerlo. Es la forma más rápida de fijarlo.</p>
  <div class="modes">${m.practicas.map(p=>`<button class="mode" onclick="startPrac('${p.id}')"><b>${p.title}</b><span>${p.desc}${st[p.id]!=null?`<br>Mejor: ${st[p.id]} %`:""}</span></button>`).join("")}</div>`;
}
function startPrac(pid){
  const m = current.mod, p = m.practicas.find(x => x.id === pid);
  PR = { m, p, i: 0, ok: 0, items: p.type === "sort" ? shuffle(p.items) : shuffle(p.items.map((x,i)=>({x,i}))), checked: false };
  p.type === "sort" ? drawSort() : drawOrder(); window.scrollTo(0,0);
}
function drawSort(){
  const z = PR, it = z.items[z.i], v = $("#view");
  if (!it) { const pct = Math.round(z.ok/z.items.length*100); const st = ensure(S.prac, z.m.id); st[z.p.id] = Math.max(st[z.p.id]||0, pct); save();
    v.innerHTML = `<div class="kicker">Práctica</div><h1>${z.p.title}</h1><div class="qbox" style="text-align:center;margin-top:20px"><div class="score">${pct} %</div><p class="lead" style="margin:10px auto">${z.ok} de ${z.items.length} bien clasificadas.</p><div class="row" style="justify-content:center"><button class="btn" onclick="startPrac('${z.p.id}')">Repetir</button><button class="btn ghost" onclick="go('${z.m.id}-practica')">Otras prácticas</button></div></div>`; return; }
  v.innerHTML = `<div class="kicker">Práctica · ${z.i+1} de ${z.items.length} · Aciertos ${z.ok}</div><h1 style="font-size:30px">${z.p.title}</h1><p class="muted">${z.p.desc}</p>
  <div class="sorter"><div class="item-now">${it[0]}</div><div class="cats">${z.p.cats.map((c,k)=>`<button class="cat" data-k="${k}" onclick="sortPick(${k})">${c}</button>`).join("")}</div><div id="sfb"></div></div>
  <div class="row" style="margin-top:14px"><button class="btn ghost small" onclick="go('${z.m.id}-practica')">Salir</button></div>`;
}
function sortPick(k){
  const z = PR, it = z.items[z.i], right = k === it[1];
  if (right) z.ok++;
  document.querySelectorAll(".cat").forEach(b => { b.disabled = true; const bk = +b.dataset.k; if (bk === it[1]) b.classList.add("right"); else if (bk === k) b.classList.add("wrong"); });
  $("#sfb").innerHTML = `<div class="row" style="justify-content:space-between;margin-top:14px"><b style="color:${right?"var(--ok)":"var(--seal)"}">${right?"Correcto":"Va en: "+z.p.cats[it[1]]}</b><button class="btn" id="snext" onclick="PR.i++;drawSort()">Continuar</button></div>`;
  $("#snext").focus();
}
function drawOrder(){
  const z = PR, v = $("#view");
  v.innerHTML = `<div class="kicker">Práctica de orden</div><h1 style="font-size:30px">${z.p.title}</h1><p class="muted">${z.p.desc} Usa las flechas para mover cada elemento.</p>
  <ul class="order-list">${z.items.map((o,pos)=>`<li class="${z.checked?(o.i===pos?"good":"bad"):""}"><span class="tx">${o.x}</span><button class="iconbtn" aria-label="Subir" onclick="mv(${pos},-1)" ${pos===0?"disabled":""}>↑</button><button class="iconbtn" aria-label="Bajar" onclick="mv(${pos},1)" ${pos===z.items.length-1?"disabled":""}>↓</button></li>`).join("")}</ul>
  <div class="row"><button class="btn" onclick="checkOrder()">Comprobar orden</button><button class="btn ghost" onclick="startPrac('${z.p.id}')">Barajar de nuevo</button><button class="btn ghost" onclick="go('${z.m.id}-practica')">Salir</button></div><div id="ofb" style="margin-top:12px"></div>`;
}
function mv(pos, d){ const a = PR.items; [a[pos], a[pos+d]] = [a[pos+d], a[pos]]; PR.checked = false; drawOrder(); }
function checkOrder(){
  const z = PR; z.checked = true; const ok = z.items.filter((o,pos)=>o.i===pos).length, pct = Math.round(ok/z.items.length*100);
  const st = ensure(S.prac, z.m.id); st[z.p.id] = Math.max(st[z.p.id]||0, pct); save(); drawOrder();
  $("#ofb").innerHTML = `<div class="expl"><b>${ok} de ${z.items.length} en su lugar.</b> ${pct===100?"Orden perfecto.":"Los elementos en rojo están fuera de lugar; muévelos y vuelve a comprobar."}</div>`;
}

/* ---------- Glosario y normas ---------- */
function viewGlosario(m){
  return `<div class="kicker">Módulo ${m.n}</div><h1>Glosario</h1>
  <p class="lead" style="margin:14px 0 18px">Términos del glosario oficial del módulo y otros conceptos clave del texto.</p>
  <input class="search" id="gq" type="search" placeholder="Buscar término o definición" aria-label="Buscar en el glosario">
  <dl class="gloss" id="gl"></dl>`;
}
function initGlosario(m){
  const draw = () => { const q = $("#gq").value.toLowerCase().trim();
    const list = m.glosario.filter(([a,b]) => !q || (a+" "+b).toLowerCase().includes(q));
    $("#gl").innerHTML = list.length ? list.map(([a,b])=>`<dt>${a}</dt><dd>${b}</dd>`).join("") : `<div class="empty">Ningún término coincide con “${esc(q)}”.</div>`; };
  $("#gq").oninput = draw; draw();
}
function viewNormas(m){
  return `<div class="kicker">Módulo ${m.n}</div><h1>Normas y sentencias</h1>
  <p class="lead" style="margin:14px 0 18px">Todo lo citado en el módulo, con la idea que debes asociar a cada referencia.</p>
  <div class="fc-tools"><input class="search" id="nq" type="search" placeholder="Buscar artículo, decreto o sentencia" style="margin:0;flex:1;min-width:200px" aria-label="Buscar normas">
  <select id="nt" aria-label="Filtrar por tema"><option value="">Todos los temas</option>${m.temas.map(t=>`<option value="${t.id}">${t.short}</option>`).join("")}</select></div>
  <div class="tablewrap"><table><thead><tr><th>Referencia</th><th>Qué debes recordar</th><th>Tema</th></tr></thead><tbody id="nb"></tbody></table></div>`;
}
function initNormas(m){
  const draw = () => { const q = $("#nq").value.toLowerCase().trim(), t = $("#nt").value;
    const list = m.normas.filter(([a,b,c]) => (!t || c===t) && (!q || (a+" "+b).toLowerCase().includes(q)));
    $("#nb").innerHTML = list.length ? list.map(([a,b,c])=>`<tr><td>${a}</td><td>${b}</td><td><a href="#${m.id}-${c}">${temaName(m,c)}</a></td></tr>`).join("") : `<tr><td colspan="3" class="muted">Sin coincidencias.</td></tr>`; };
  $("#nq").oninput = draw; $("#nt").onchange = draw; draw();
}

render();

</script>
</body>
</html>
