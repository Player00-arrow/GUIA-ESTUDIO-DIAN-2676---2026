<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Estudio Concurso DIAN 2676 de 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Literata:opsz,wght@7..72,400;7..72,500;7..72,600;7..72,700&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F2F5F9; --surface:#FFFFFF; --surface2:#E6ECF3; --ink:#14213A; --muted:#55627A;
  --line:#D2DAE5; --ledger:#0B3B6F; --ledger-soft:#DCE7F3; --hi:#F6D84A; --hi-ink:#17201E;
  --teal:#0E8A82; --green:#1E8C4E; --cyan:#2BB8D0;
  --seal:#A8322A; --seal-soft:#F5DEDA; --ok:#1F6E43; --ok-soft:#D9EEDF;
  --serif:"Literata", Georgia, "Times New Roman", serif;
  --sans:"Archivo", "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  color-scheme: light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1622; --surface:#152030; --surface2:#1C2A3D; --ink:#E6EDF5; --muted:#A2B2C4;
    --line:#2A3A50; --ledger:#6FB4F0; --ledger-soft:#1A3150; --hi:#E7C93C; --hi-ink:#151A18;
    --teal:#3CC8BE; --green:#5BCB8A; --cyan:#4FD3E6;
    --seal:#EC8A7D; --seal-soft:#3A2220; --ok:#7FD3A0; --ok-soft:#1B3326; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1622; --surface:#152030; --surface2:#1C2A3D; --ink:#E6EDF5; --muted:#A2B2C4;
  --line:#2A3A50; --ledger:#6FB4F0; --ledger-soft:#1A3150; --hi:#E7C93C; --hi-ink:#151A18;
  --teal:#3CC8BE; --green:#5BCB8A; --cyan:#4FD3E6;
  --seal:#EC8A7D; --seal-soft:#3A2220; --ok:#7FD3A0; --ok-soft:#1B3326; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:calc(env(safe-area-inset-top,0px) + 70px)}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
a{color:var(--ledger)}
:focus-visible{outline:3px solid var(--hi);outline-offset:2px;border-radius:4px}
mark,.hl{background:linear-gradient(transparent 12%, var(--hi) 12%, var(--hi) 88%, transparent 88%);color:var(--hi-ink);padding:0 .15em;border-radius:2px}

/* franja institucional y créditos */
.stripe{height:7px;background:linear-gradient(90deg,var(--ledger) 0 42%,var(--teal) 42% 68%,var(--green) 68% 84%,var(--cyan) 84%)}
.kicker{color:var(--teal)!important}
.cell .tag{background:var(--teal)!important}
.route .num{color:var(--teal)!important}
.mnemo{border-left:5px solid var(--teal)!important}
.hero{border-bottom:3px solid var(--ledger)!important}
.credit{margin-top:56px;padding:18px 20px;border-top:5px solid var(--ledger);background:var(--surface);border-radius:0 0 12px 12px;font-size:14px;color:var(--muted);line-height:1.55}
.credit b{color:var(--ink);font-family:var(--serif);font-size:16px}
.credit .disc{display:inline-block;margin-top:8px;padding:4px 10px;border-radius:6px;background:var(--hi);color:var(--hi-ink);font-weight:600;font-size:13px}
.sidecredit{margin-top:16px;font-size:12px;color:var(--muted);line-height:1.45;border-top:1px solid var(--line);padding-top:12px}
.sidecredit b{color:var(--ink)}

/* layout */
.shell{display:grid;grid-template-columns:290px minmax(0,1fr);min-height:100vh}
aside.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100vh - env(safe-area-inset-top,0px));overflow:auto;border-right:1px solid var(--line);padding:22px 18px 28px;background:var(--surface)}
.brand{display:flex;gap:12px;align-items:center;margin-bottom:22px;text-decoration:none;color:var(--ink)}
.seal{width:44px;height:44px;border-radius:50%;border:2px solid var(--ledger);display:grid;place-items:center;font-family:var(--serif);font-weight:700;color:var(--ledger);font-size:13px;flex:none}
.brand b{display:block;font-family:var(--serif);font-size:17px;line-height:1.2}
.brand span{font-size:13px;color:var(--muted)}
.side h4{font-size:13px;font-weight:600;color:var(--muted);margin:20px 0 8px}
.modbtn{display:flex;gap:10px;width:100%;text-align:left;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;cursor:pointer;margin-bottom:8px;align-items:center}
.modbtn[aria-current="true"]{border-color:var(--ledger);background:var(--ledger-soft)}
.modbtn .n{font-family:var(--serif);font-weight:700;font-size:20px;color:var(--ledger);width:26px}
.modbtn small{display:block;color:var(--muted);font-size:12px}
.modbtn.pending{opacity:.6;cursor:default}
nav.sections a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:8px;text-decoration:none;color:var(--ink);font-size:15px}
nav.sections a:hover{background:var(--surface2)}
nav.sections a[aria-current="page"]{background:var(--ink);color:var(--paper)}
nav.sections a .cnt{font-size:12px;color:var(--muted)}
nav.sections a[aria-current="page"] .cnt{color:var(--paper);opacity:.75}
.prog{margin-top:22px;padding:14px;border-radius:10px;background:var(--paper);border:1px solid var(--line)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden;margin:6px 0 4px}
.bar i{display:block;height:100%;background:var(--ledger);border-radius:99px;transition:width .4s}
.prog p{margin:0;font-size:13px;color:var(--muted)}
.themebtn{margin-top:14px;background:none;border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;cursor:pointer;color:var(--muted)}

main{padding:36px clamp(18px,4vw,56px) 80px;min-width:0}
.wrap{max-width:860px;margin:0 auto}
.topbar{display:none}

/* type */
h1,h2,h3{font-family:var(--serif);line-height:1.2;margin:0}
h1{font-size:clamp(30px,4.4vw,46px);font-weight:700;letter-spacing:-.01em}
h2{font-size:28px;font-weight:600;margin:40px 0 14px}
h3{font-size:20px;font-weight:600;margin:28px 0 10px}
.lead{font-family:var(--serif);font-size:19px;line-height:1.65;color:var(--ink);max-width:68ch}
.prose{font-family:var(--serif);font-size:17px;line-height:1.72;max-width:70ch}
.prose p{margin:0 0 14px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 14px}
.prose li{margin-bottom:6px}
.prose blockquote{margin:14px 0;padding:10px 16px;border-left:4px solid var(--ledger);background:var(--surface);font-size:16px;border-radius:0 8px 8px 0}
.prose blockquote cite{display:block;font-style:normal;font-family:var(--sans);font-size:13px;color:var(--muted);margin-top:6px}
.muted{color:var(--muted)}
.kicker{font-size:14px;color:var(--ledger);font-weight:600;margin-bottom:10px}

/* hero */
.hero{padding:10px 0 26px;border-bottom:1px solid var(--line);margin-bottom:28px}
.hero h1 .swipe{background:linear-gradient(var(--hi),var(--hi)) no-repeat 0 82%/0% 34%;animation:swipe 1.1s .25s cubic-bezier(.6,.1,.2,1) forwards;padding:0 .08em}
@keyframes swipe{to{background-size:100% 34%}}
@media (prefers-reduced-motion:reduce){.hero h1 .swipe{animation:none;background-size:100% 34%}}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{font-size:13px;border:1px solid var(--line);border-radius:99px;padding:4px 11px;background:var(--surface);color:var(--muted)}

/* route */
.route{list-style:none;padding:0;margin:0;counter-reset:r}
.route li{display:grid;grid-template-columns:46px 1fr auto;gap:14px;align-items:start;padding:16px 0;border-bottom:1px solid var(--line)}
.route .num{font-family:var(--serif);font-size:30px;font-weight:700;color:var(--ledger);line-height:1}
.route h3{margin:0 0 4px;font-size:19px}
.route p{margin:0;color:var(--muted);font-size:15px}
.route .done{font-size:13px;color:var(--ok);font-weight:600;white-space:nowrap}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--ink);background:var(--ink);color:var(--paper);border-radius:8px;padding:9px 16px;cursor:pointer;font-weight:600;font-size:15px;text-decoration:none}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink)}
.btn.small{padding:6px 11px;font-size:14px}
.btn:disabled{opacity:.45;cursor:default}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

/* tema */
.temanav{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:24px}
.temanav a{font-size:14px;padding:6px 12px;border-radius:99px;border:1px solid var(--line);text-decoration:none;color:var(--ink);background:var(--surface)}
.temanav a[aria-current="true"]{background:var(--ledger);color:var(--paper);border-color:var(--ledger)}
.sintesis{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin:18px 0 6px}
.sintesis b{font-family:var(--sans);font-size:14px;color:var(--ledger);display:block;margin-bottom:6px}
details.block{border-top:1px solid var(--line);padding:4px 0}
details.block summary{cursor:pointer;list-style:none;padding:14px 0;font-family:var(--serif);font-size:20px;font-weight:600;display:flex;justify-content:space-between;gap:12px}
details.block summary::-webkit-details-marker{display:none}
details.block summary::after{content:"+";font-family:var(--sans);font-weight:400;color:var(--muted);font-size:24px;line-height:1}
details.block[open] summary::after{content:"−"}
.trampas{margin:26px 0;border:2px dashed var(--seal);border-radius:12px;padding:16px 20px;background:var(--seal-soft)}
.trampas h3{margin:0 0 8px;color:var(--seal);font-size:18px}
.trampas ul{margin:0;padding-left:20px;font-family:var(--serif);line-height:1.6}
.nota{margin:16px 0;border-left:4px solid var(--hi);background:var(--surface);padding:12px 16px;border-radius:0 8px 8px 0;font-size:15px}
.mini-diagrams{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}

/* diagrams */
.diag{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin:16px 0 28px;overflow-x:auto}
.diag h3{margin:0 0 4px}
.diag > p{margin:0 0 16px;color:var(--muted);font-size:15px}
.tree{display:flex;flex-direction:column;align-items:center;gap:0;min-width:640px}
.node{border:2px solid var(--ledger);border-radius:10px;padding:8px 12px;background:var(--paper);text-align:center;font-weight:600;font-size:14px}
.node.root{background:var(--ledger);color:var(--paper);font-family:var(--serif);font-size:16px}
.node small{display:block;font-weight:400;color:var(--muted);font-size:12px}
.node.root small{color:var(--paper);opacity:.8}
.vline{width:2px;height:18px;background:var(--ledger)}
.branches{display:grid;gap:10px;width:100%;position:relative;padding-top:18px}
.branches::before{content:"";position:absolute;top:0;left:7%;right:7%;height:2px;background:var(--ledger)}
.branch{display:flex;flex-direction:column;align-items:stretch;gap:6px;position:relative}
.branch::before{content:"";position:absolute;top:-18px;left:50%;width:2px;height:18px;background:var(--ledger)}
.leaf{border:1px solid var(--line);border-radius:8px;padding:6px 8px;font-size:13px;background:var(--surface);line-height:1.35}
.leaf b{font-weight:600}
.pyr{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:560px}
.pyr div{background:var(--ledger-soft);border:1px solid var(--ledger);border-radius:6px;padding:7px 10px;text-align:center;font-size:13.5px;line-height:1.3}
.pyr div:first-child{background:var(--ink);color:var(--paper);font-family:var(--serif);font-weight:700;font-size:16px;border-color:var(--ink)}
.flow{display:flex;flex-direction:column;gap:0;align-items:center;min-width:520px}
.fstep{border:2px solid var(--ink);border-radius:10px;padding:10px 14px;background:var(--paper);max-width:520px;width:100%;text-align:center;font-size:14.5px}
.fstep b{display:block;font-family:var(--serif);font-size:16px}
.fstep.dec{border-style:dashed;border-color:var(--ledger);border-radius:40px}
.fstep.out{background:var(--hi);color:var(--hi-ink);border-color:var(--hi)}
.arrow{width:2px;height:22px;background:var(--ink);position:relative;margin:0 auto}
.arrow::after{content:"";position:absolute;bottom:-1px;left:-5px;border:6px solid transparent;border-top-color:var(--ink);border-bottom:0}
.arrow span{position:absolute;left:10px;top:2px;font-size:12px;color:var(--muted);white-space:nowrap}
.fork{display:grid;grid-template-columns:1fr 1fr;gap:14px;width:100%;max-width:620px}
.eq{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;font-family:var(--serif);font-size:16px}
.eq .t{border:2px solid var(--ledger);border-radius:8px;padding:8px 12px;background:var(--paper);text-align:center}
.eq .t small{display:block;font-family:var(--sans);font-size:11.5px;color:var(--muted)}
.eq .op{font-size:24px;font-weight:700;color:var(--ledger)}
.timeline{position:relative;padding-left:28px;min-width:420px}
.timeline::before{content:"";position:absolute;left:9px;top:4px;bottom:4px;width:2px;background:var(--ledger)}
.tl{position:relative;margin-bottom:14px}
.tl::before{content:"";position:absolute;left:-25px;top:5px;width:14px;height:14px;border-radius:50%;background:var(--paper);border:3px solid var(--ledger)}
.tl b{font-family:var(--serif);font-size:18px;color:var(--ledger);margin-right:8px}
.tl span{font-size:15px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px}
.cell{border:1px solid var(--line);border-radius:10px;padding:12px;background:var(--paper)}
.cell h4{margin:0 0 6px;font-family:var(--serif);font-size:16px}
.cell p,.cell ul{margin:0;font-size:14px;color:var(--ink)}
.cell ul{padding-left:18px}
.cell .tag{display:inline-block;font-size:12px;background:var(--ledger);color:var(--paper);border-radius:6px;padding:1px 7px;margin-bottom:6px;font-weight:600}
.cycle{display:grid;grid-template-columns:1fr 60px 1fr;grid-template-rows:auto 40px auto;gap:6px;max-width:560px;margin:0 auto;align-items:center;text-align:center;min-width:420px}
.cycle .c{border:2px solid var(--ledger);border-radius:50%;aspect-ratio:1/0.62;display:grid;place-items:center;padding:10px;font-size:13.5px;font-weight:600;background:var(--paper)}
.cycle .ar{font-size:26px;color:var(--ledger);font-weight:700}
.diag-index{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:10px;margin-bottom:10px}
.diag-index a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:10px;text-decoration:none;color:var(--ink);background:var(--surface)}
.diag-index a small{display:block;color:var(--muted);font-size:13px}

/* mnemo */
.mnemo{border:1px solid var(--line);border-radius:14px;background:var(--surface);padding:18px 20px;margin-bottom:14px}
.mnemo .key{font-family:var(--serif);font-size:30px;font-weight:700;letter-spacing:.02em;color:var(--ledger);margin:4px 0 2px;word-break:break-word}
.mnemo .phrase{font-family:var(--serif);font-size:18px;font-style:italic;margin-bottom:10px}
.mnemo .phrase b{font-style:normal;background:var(--hi);color:var(--hi-ink);padding:0 2px;border-radius:2px}
.letters{display:flex;flex-wrap:wrap;gap:8px}
.letter{display:flex;gap:8px;align-items:baseline;border:1px solid var(--line);border-radius:8px;padding:6px 10px;background:var(--paper);font-size:14px}
.letter b{font-family:var(--serif);font-size:18px;color:var(--ledger)}
.mnemo .use{font-size:14px;color:var(--muted);margin-top:10px}

/* flashcards */
.fc-tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
select{font:inherit;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:7px 10px}
.card3d{perspective:1400px;margin:0 auto;max-width:640px}
.card{position:relative;height:330px;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.card.flip{transform:rotateY(180deg)}
@media (prefers-reduced-motion:reduce){.card{transition:none}}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:16px;padding:26px;display:flex;flex-direction:column;justify-content:center;border:1px solid var(--line);overflow:auto}
.face.front{background:var(--surface);box-shadow:0 1px 0 var(--line), 6px 6px 0 var(--ledger-soft)}
.face.back{background:var(--ledger);color:var(--paper);transform:rotateY(180deg)}
.face .q{font-family:var(--serif);font-size:23px;line-height:1.35;font-weight:600}
.face .a{font-family:var(--serif);font-size:18px;line-height:1.55}
.face .tagline{position:absolute;top:14px;left:20px;font-size:12px;color:var(--muted)}
.face.back .tagline{color:var(--paper);opacity:.75}
.fc-actions{display:flex;justify-content:center;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn.know{background:var(--ok);border-color:var(--ok);color:var(--paper)}
.btn.again{background:var(--seal);border-color:var(--seal);color:var(--paper)}
.fc-count{text-align:center;color:var(--muted);font-size:14px;margin-top:10px}

/* quiz */
.qbox{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:22px}
.qmeta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-bottom:10px;gap:10px;flex-wrap:wrap}
.qtext{font-family:var(--serif);font-size:21px;line-height:1.45;margin:0 0 16px;font-weight:500}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:12px;text-align:left;border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:12px 14px;cursor:pointer;font-size:15.5px;line-height:1.4}
.opt:hover:not(:disabled){border-color:var(--ink)}
.opt .l{font-weight:700;color:var(--ledger);min-width:18px}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.wrong{border-color:var(--seal);background:var(--seal-soft)}
.opt:disabled{cursor:default}
.expl{margin-top:14px;padding:14px 16px;border-radius:10px;background:var(--surface2);font-family:var(--serif);font-size:16px;line-height:1.6}
.expl b{font-family:var(--sans)}
.score{font-family:var(--serif);font-size:64px;font-weight:700;color:var(--ledger);line-height:1}
.qprog{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden;margin-bottom:16px}
.qprog i{display:block;height:100%;background:var(--hi)}
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px;margin:16px 0}
.mode{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px;text-align:left;cursor:pointer}
.mode:hover{border-color:var(--ink)}
.mode b{display:block;font-family:var(--serif);font-size:17px}
.mode span{font-size:14px;color:var(--muted)}
.review li{margin-bottom:12px}

/* practice */
.sorter{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px}
.item-now{font-family:var(--serif);font-size:24px;font-weight:600;text-align:center;padding:22px 10px;border:2px dashed var(--line);border-radius:12px;margin:10px 0 16px;background:var(--paper)}
.cats{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px}
.cat{border:1.5px solid var(--line);background:var(--paper);border-radius:10px;padding:10px;cursor:pointer;font-weight:600;font-size:14.5px}
.cat:hover{border-color:var(--ledger)}
.cat.right{border-color:var(--ok);background:var(--ok-soft)}
.cat.wrong{border-color:var(--seal);background:var(--seal-soft)}
.order-list{list-style:none;padding:0;margin:12px 0}
.order-list li{display:flex;gap:10px;align-items:center;border:1px solid var(--line);background:var(--paper);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.order-list li .tx{flex:1;font-size:15px}
.order-list li.good{border-color:var(--ok);background:var(--ok-soft)}
.order-list li.bad{border-color:var(--seal);background:var(--seal-soft)}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:6px;width:32px;height:32px;cursor:pointer;font-size:15px}

/* glossary & normas */
.search{width:100%;font:inherit;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--ink);margin-bottom:16px}
dl.gloss{margin:0}
dl.gloss dt{font-family:var(--serif);font-weight:700;font-size:18px;margin-top:16px}

<script>
/* ===================== MÓDULO 1 · TEORÍA DE LA IMPOSICIÓN ===================== */
const M1 = {
  id: "m1", n: 1,
  title: "Teoría de la imposición",
  course: "Curso 1 · Administración de cartera, recaudo y devoluciones",
  pages: 91,
  presentacion: `Este módulo construye la base jurídica de todo lo demás: de dónde sale el poder del Estado para cobrar impuestos, qué límites tiene, cómo se interpretan las normas tributarias, cuáles son los elementos de cada tributo y cómo está organizada y gestionada la DIAN. Si dominas este módulo, entiendes el “por qué” de la cartera, el recaudo y las devoluciones.`,
  objetivo: `Comprender el esquema del ordenamiento jurídico que faculta al Estado a imponer a los particulares la obligación de contribuir con las cargas públicas.`,
  objetivos: [
    "Comprender las ramas del poder público, los órganos de control, los entes autónomos e independientes y el funcionamiento esencial de la justicia.",
    "Analizar cómo los principios constitucionales permean la materia tributaria, identificar las fuentes del derecho y sus métodos de interpretación.",
    "Identificar los elementos de la obligación tributaria en los impuestos administrados por la DIAN.",
    "Conocer el sistema de gestión de la DIAN.",
    "Entender los planes, valores y políticas de la DIAN."
  ],
  temas: [
  /* ---------------- TEMA 1 ---------------- */
  {
    id: "t1", short: "Estructura del Estado",
    title: "Ramas del poder público, órganos de control, organización electoral, órganos autónomos y SIVJRNR",
    sintesis: `El Estado es una estructura de poder. Clásicamente se divide en tres ramas (legislativa, ejecutiva y judicial), pero la Constitución de 1991 agregó órganos autónomos e independientes, órganos de control, organización electoral y, desde 2017, el Sistema Integral de Verdad, Justicia, Reparación y No Repetición. En lo tributario esto importa desde el nacimiento del tributo: solo los cuerpos de representación popular pueden crearlo.`,
    diagrams: ["estado", "judicial"],
    blocks: [
      { h: "El Estado y sus cuatro elementos", html: `
        <p>Definición de <b>Vladimiro Naranjo Mesa</b> (2018): el Estado es «un conglomerado social, política y jurídicamente constituido, asentado sobre un territorio determinado, sometido a una autoridad que se ejerce a través de sus propios órganos, y cuya soberanía es reconocida por otros Estados».</p>
        <ul>
          <li><mark>Población</mark>: conglomerado social, política y jurídicamente constituido; sustento del Estado.</li>
          <li><mark>Territorio</mark>: espacio físico donde se asienta la población y se ejerce el poder (arts. 101 y 103 CP).</li>
          <li><mark>Autoridad</mark>: se ejerce a través de órganos propios. En sentido estricto, el Estado equivale a los órganos que ejercen el poder público, o incluso solo al poder central.</li>
          <li><mark>Soberanía</mark>: reconocida por otros Estados; permite suscribir tratados, tener representación diplomática y conlleva responsabilidad internacional.</li>
        </ul>` },
      { h: "El poder público y la separación de poderes (art. 113 CP)", html: `
        <p>Poder legítimo es el que surge y se ejerce en los términos previstos por la Constitución. La Constitución organiza el poder y fija los principios que guían a sus órganos.</p>
        <blockquote>«Son Ramas del Poder Público, la legislativa, la ejecutiva, y la judicial. Además de los órganos que las integran existen otros, autónomos e independientes, para el cumplimiento de las demás funciones del Estado. Los diferentes órganos del Estado tienen funciones separadas, pero <b>colaboran armónicamente</b> para la realización de sus fines.»<cite>Constitución Política, artículo 113</cite></blockquote>
        <p><b>Sentencia C-312 de 1997</b>: la separación de poderes busca evitar la arbitrariedad y asegurar la libertad; los órganos se controlan recíprocamente. Modelo tripartito de <b>Montesquieu</b>; en EE. UU. se desarrolló como <i>checks and balances</i> (cooperación) y en Europa como separación rígida.</p>
        <p>En la Asamblea Constituyente de 1991 se propuso crear ramas de control y electoral, pero <mark>se mantuvo el modelo tripartito</mark> admitiendo otros órganos autónomos e independientes.</p>` },
      { h: "Rama legislativa", html: `
        <p>El <b>Congreso</b> es bicameral: <b>Senado</b> (circunscripción nacional + circunscripción especial indígena, art. 171) y <b>Cámara de Representantes</b> (circunscripciones territoriales, art. 176).</p>
        <p>Por qué dos cámaras (C-225 de 2008): representan intereses distintos, permiten pesos y contrapesos internos, mejoran la producción legislativa y generan leyes más estables.</p>
        <p><b>Art. 114 CP</b>: corresponde al Congreso <mark>reformar la Constitución, hacer las leyes y ejercer control político</mark> sobre el gobierno y la administración.</p>
        <p>En lo tributario (C-594 de 2010): el art. 338 desarrolla el principio de que <mark>no hay impuesto sin representación</mark>. Solo los órganos de representación popular imponen tributos (salvo estados de excepción). De la legalidad se deriva la <b>certeza</b>: los elementos deben fijarse con claridad y precisión.</p>
        <p>Recuerda (C-511 de 2019): el <b>art. 150-10</b> prohíbe que el Congreso otorgue facultades extraordinarias al Presidente para <b>decretar impuestos</b>.</p>` },
      { h: "Rama ejecutiva", html: `
        <p>Ejerce la administración pública o de gobierno. La Rama Ejecutiva Nacional corresponde a la Administración Pública Central (C-910 de 2007); las entidades descentralizadas por servicios se “vinculan” a ella.</p>
        <blockquote>Art. 115 CP: el Presidente es <b>Jefe de Estado, Jefe de Gobierno y suprema autoridad administrativa</b>. El Gobierno Nacional lo forman el Presidente, los ministros y los directores de departamentos administrativos. Gobernaciones, alcaldías, superintendencias, establecimientos públicos y empresas industriales y comerciales del Estado forman parte de la Rama Ejecutiva.</blockquote>
        <p>Los actos del Presidente requieren firma del ministro o director del ramo (refrendación), salvo el nombramiento y remoción de ministros y directores y los expedidos como Jefe de Estado y suprema autoridad administrativa.</p>
        <p><b>La DIAN</b> es una <mark>Unidad Administrativa Especial</mark> (UAE). C-722 de 1999: las UAE son una modalidad de <b>desconcentración</b> (art. 209 CP), presentes desde el Decreto 1050 de 1968. Ley 489 de 1998, art. 67: sin personería jurídica pertenecen al sector central; <b>con personería jurídica</b> son del sector descentralizado.</p>
        <p><b>Decreto 1071 de 1999, art. 1</b>: la DIAN es UAE del orden nacional, de carácter eminentemente técnico y especializado, con <mark>personería jurídica, autonomía administrativa y presupuestal y patrimonio propio</mark>, <b>adscrita</b> al Ministerio de Hacienda y Crédito Público. Tiene sistema especial de personal, carrera específica y régimen disciplinario especial. Su régimen presupuestal y de contratación es el de los <b>establecimientos públicos</b> del orden nacional.</p>` },
      { h: "Rama judicial", html: `
        <p><b>Art. 116 CP</b>: administran justicia la Corte Constitucional, la Corte Suprema de Justicia, el Consejo de Estado, la Comisión Nacional de Disciplina Judicial, la Fiscalía General, los tribunales y los jueces. También la Justicia Penal Militar.</p>
        <ul>
          <li>Excepcionalmente la ley atribuye <b>funciones jurisdiccionales a autoridades administrativas</b>, pero no pueden instruir sumarios ni juzgar delitos.</li>
          <li>Los <b>particulares</b> pueden administrar justicia transitoriamente como jurados, conciliadores o árbitros.</li>
        </ul>
        <p><b>Ley 270 de 1996 (Estatutaria de Administración de Justicia), art. 11</b>, modificado por la Ley 1285 de 2009: jurisdicción ordinaria, contencioso administrativa, constitucional y de paz, más la Fiscalía y el Consejo Superior de la Judicatura.</p>
        <p>En materia tributaria: la <mark>jurisdicción de lo contencioso administrativo</mark> controla la legalidad de actos generales (decretos, acuerdos, ordenanzas) y particulares (liquidaciones oficiales, resoluciones sanción). La <mark>Corte Constitucional</mark> decide la constitucionalidad de las leyes con impacto tributario.</p>` },
      { h: "Órganos de control", html: `
        <p><b>Ministerio Público (art. 118)</b>: lo ejercen el Procurador General, el Defensor del Pueblo, los procuradores delegados y agentes, los personeros municipales y demás que fije la ley. Le corresponde la guarda de los derechos humanos, la protección del interés público y la vigilancia de la conducta oficial.</p>
        <p><b>Procuraduría (art. 277)</b>: vigila el cumplimiento de la Constitución y la ley, protege derechos humanos con auxilio del Defensor, defiende intereses de la sociedad y colectivos (ambiente), vela por el ejercicio diligente de funciones administrativas, ejerce <mark>preferentemente el poder disciplinario</mark> (incluso sobre cargos de elección popular) e interviene en procesos.</p>
        <p><b>Personerías</b>: autonomía presupuestal y administrativa; ejercen el Ministerio Público bajo la dirección suprema del Procurador.</p>
        <p><b>Defensoría del Pueblo (art. 282)</b>: promoción, ejercicio y divulgación de los derechos humanos.</p>
        <p><b>Contraloría General (art. 267)</b>: entidad técnica que vigila la <mark>gestión fiscal</mark> de la administración y de particulares que manejen fondos o bienes públicos. Las contralorías territoriales son técnicamente independientes, pero la CGR puede asumir sus competencias en casos de especial trascendencia.</p>
        <p><b>Auditoría General (art. 274)</b>: vigila la gestión fiscal de la Contraloría General y de las contralorías territoriales. Es el “control del controlador”.</p>` },
      { h: "Organización electoral", html: `
        <p>Garantiza el derecho a elegir y ser elegido (art. 40).</p>
        <ul>
          <li><b>Registraduría Nacional del Estado Civil (art. 266)</b>: dirección y organización de las elecciones, registro civil e identificación de las personas.</li>
          <li><b>Consejo Nacional Electoral (art. 265)</b>: regula, inspecciona, vigila y controla la actividad electoral de partidos, movimientos, grupos significativos de ciudadanos y candidatos; tiene autonomía presupuestal y administrativa.</li>
        </ul>` },
      { h: "Órganos autónomos e independientes", html: `
        <ul>
          <li><b>Banco de la República (art. 371)</b>: autoridad monetaria, cambiaria y crediticia. Persona jurídica de derecho público con autonomía administrativa, patrimonial y técnica. Funciones: regular moneda, cambios internacionales y crédito; emitir la moneda legal; administrar reservas internacionales; ser <mark>prestamista de última instancia</mark> y banquero de los establecimientos de crédito; servir como <mark>agente fiscal del gobierno</mark>.</li>
          <li><b>Comisión Nacional del Servicio Civil (art. 130)</b>: administra y vigila las carreras de los servidores públicos, <b>excepto las de carácter especial</b>. C-391 de 1993: el <mark>mérito</mark> y la estabilidad son la base de la carrera.</li>
          <li><b>Corporaciones Autónomas Regionales y de Desarrollo Sostenible</b>: creadas por ley, integradas por entidades territoriales de un mismo ecosistema; administran el medio ambiente y los recursos naturales renovables.</li>
          <li><b>Entes universitarios autónomos</b> (Ley 30 de 1992, art. 57; art. 69 CP): personería jurídica, autonomía académica, administrativa y financiera, patrimonio independiente. Ej.: Universidad Nacional, UNAD, Universidad del Cauca, UPTC, Universidad Militar Nueva Granada.</li>
        </ul>
        <div class="nota">La carrera de la DIAN es un <b>sistema específico</b> de carrera (Decreto 1071 de 1999). Dato útil para un concurso: la CNSC administra las carreras salvo las de carácter especial.</div>` },
      { h: "Sistema Integral de Verdad, Justicia, Reparación y No Repetición", html: `
        <p>Creado por el <b>Acto Legislativo 01 de 2017</b> (disposiciones transitorias para la terminación del conflicto). Combina mecanismos judiciales y extrajudiciales para los derechos de las víctimas, rendición de cuentas, seguridad jurídica, convivencia y no repetición.</p>
        <ul>
          <li><b>Jurisdicción Especial para la Paz (JEP)</b>.</li>
          <li><b>Comisión para el Esclarecimiento de la Verdad, la Convivencia y la No Repetición</b>.</li>
          <li><b>Unidad para la Búsqueda de Personas dadas por Desaparecidas</b> en el contexto y en razón del conflicto armado.</li>
        </ul>
        <div class="nota">El texto del módulo cita en un punto el “Acto Legislativo 01 de 2016” al hablar de la reforma que incluyó el Sistema. El acto que crea el título transitorio del SIVJRNR es el <b>AL 01 de 2017</b>; el AL 01 de 2016 fue el del procedimiento legislativo especial para la paz. Si te lo preguntan, responde 2017.</div>` }
    ],
    trampas: [
      "La Constitución de 1991 NO creó una “rama de control” ni una “rama electoral”: son órganos, no ramas.",
      "La DIAN pertenece a la Rama Ejecutiva y está ADSCRITA (no vinculada) al Ministerio de Hacienda.",
      "UAE sin personería jurídica = sector central; UAE con personería (como la DIAN) = sector descentralizado (Ley 489/98, arts. 67 y 68).",
      "El Congreso NO puede dar facultades extraordinarias al Presidente para decretar impuestos (art. 150-10).",
      "Las autoridades administrativas con función jurisdiccional nunca pueden instruir sumarios ni juzgar delitos.",
      "La Auditoría General vigila a las contralorías, no a las entidades ejecutoras."
    ]
  },
  /* ---------------- TEMA 2 ---------------- */
  {
    id: "t2", short: "Principios, fuentes e interpretación",
    title: "Principios constitucionales y legales en materia tributaria, fuentes del derecho y métodos de interpretación",
    sintesis: `Los impuestos se rigen por un marco de valores. La Constitución es norma de normas (art. 4) y contiene una “Constitución económica” y una “Constitución tributaria”. Las fuentes del derecho se ordenan jerárquicamente (pirámide de Kelsen) y los principios tributarios funcionan a la vez como justificación y como límite del poder impositivo. Cuando la norma es ambigua u oscura, se acude a métodos de interpretación.`,
    diagrams: ["piramide", "principios", "interpretacion"],
    blocks: [
      { h: "Constitución económica y Constitución tributaria", html: `
        <p>«La Constitución es norma de normas. En todo caso de incompatibilidad entre la Constitución y la ley u otra norma jurídica, se aplicarán las disposiciones constitucionales» (art. 4). Jueces y funcionarios deben aplicar la Constitución cuando detecten incompatibilidad (excepción de inconstitucionalidad).</p>
        <p>La <b>Constitución económica</b> agrupa las reglas del sistema económico: propiedad, libertad de empresa, intervención del Estado, presupuesto y tributación. Normas rectoras:</p>
        <ul>
          <li>Propiedad privada: <b>art. 58</b>.</li>
          <li>Libertad económica: <b>art. 333</b>.</li>
          <li>Intervención del Estado: <b>art. 334</b>.</li>
          <li>Poder tributario: <b>art. 338</b>.</li>
        </ul>
        <p>La <b>Constitución tributaria</b> consagra el <mark>deber de contribuir</mark> (art. 95-9) dentro de conceptos de justicia y equidad. Conclusiones del módulo: la Constitución es la norma máxima; crea reglas que afectan la economía; incluye un catálogo de principios obligatorios para funcionarios y particulares; esos principios están dispersos en el texto.</p>` },
      { h: "Fuentes del derecho (art. 230 CP)", html: `
        <p>Los jueces están sometidos al <b>imperio de la ley</b>. Son <mark>criterios auxiliares</mark>: la <b>equidad</b>, la <b>jurisprudencia</b>, los <b>principios generales del derecho</b> y la <b>doctrina</b>.</p>
        <p>“Ley” se entiende en <b>sentido material</b> (C-104 de 1993): Constitución, ley, decretos y demás actos jurídicos. Incluye actos del CNE (265), Contraloría (268), Banco de la República (371-372) y Consejo Superior de la Judicatura (257) (C-284 de 2015).</p>
        <p>La jerarquía se define por tres criterios (C-284 de 2015): <mark>(i) contenido</mark> (tratados de DD. HH., leyes estatutarias y orgánicas tienen posición especial), <mark>(ii) órgano que la adopta</mark> (la ley prevalece sobre el decreto reglamentario) y <mark>(iii) procedimiento</mark> (los actos legislativos prevalecen sobre las leyes). Las normas territoriales se relacionan con las nacionales por coexistencia, complementariedad o subordinación.</p>
        <p><b>La costumbre</b> también es fuente (C-284 de 2015; C-486 de 1993): el preámbulo habla de un “marco jurídico” más amplio que la ley, y la costumbre tiene valor constitucional (comunidades indígenas, art. 330; soberanía popular, pluralismo). Se reconoce cuando la Constitución o la ley la invoquen y no contraríe normas imperativas.</p>
        <p>Las cuatro fuentes auxiliares:</p>
        <ul>
          <li><b>Jurisprudencia</b>: ya no es mero criterio auxiliar; ciertas decisiones tienen <mark>fuerza vinculante</mark> (precedente).</li>
          <li><b>Equidad</b>: evita que la aplicación rigurosa de la ley produzca injusticia en el caso concreto.</li>
          <li><b>Doctrina</b>: trabajos científicos que aportan elementos de juicio.</li>
          <li><b>Principios generales del derecho</b>: conceptos indeterminados que expresan valores implícitos (p. ej., nadie puede alegar en su favor su propia culpa). No se confunden con los principios constitucionales.</li>
        </ul>` },
      { h: "Pirámide normativa en Colombia", html: `
        <p>De arriba hacia abajo (versión pedagógica del módulo, sin tratados, con base en Libardo Rodríguez): Constitución → Ley (leyes del Congreso y decretos con fuerza de ley) → decretos y actos del Presidente con base en la ley → actos de otras autoridades nacionales → actos de asambleas, Concejo de Bogotá, gobernadores y alcalde de Bogotá con autorizaciones extraordinarias → actos ordinarios de gobernadores y alcalde de Bogotá → demás autoridades departamentales y del DC → concejos y alcaldes con autorizaciones extraordinarias → actos ordinarios de alcaldes → demás autoridades municipales.</p>
        <p>Consulta el esquema “Pirámide normativa”.</p>` },
      { h: "Principios constitucionales de la tributación", html: `
        <p>Son garantía para los particulares y límite al poder del Estado. No hay un capítulo único: están dispersos. Listado de <b>Catalina Hoyos (2013)</b>:</p>
        <ul>
          <li>Legalidad y reserva de ley: arts. 150, 287, 300, 313 y 338.</li>
          <li>Justicia y equidad: art. 95-9.</li>
          <li>Igualdad: art. 13.</li>
          <li>Buena fe y confianza legítima: art. 83.</li>
          <li>Progresividad y eficiencia: art. 363.</li>
          <li>Irretroactividad (incluidos los impuestos de período): arts. 338 y 363.</li>
          <li>Prohibición de rentas nacionales de destinación específica (el módulo cita “art. 369”; la norma constitucional es el <b>art. 359</b>).</li>
          <li>Debido proceso: art. 29.</li>
        </ul>` },
      { h: "Justicia y equidad (art. 95-9)", html: `
        <p>Es deber «contribuir al financiamiento de los gastos e inversiones del Estado dentro de conceptos de justicia y equidad».</p>
        <p>Es un principio <mark>bifocal</mark> (C-388 de 2016): justifica el deber de contribuir y, al mismo tiempo, es <b>barrera de contención</b> para el legislador.</p>
        <p>C-464 de 1993: el antiguo “impuesto confiscatorio” se analiza hoy bajo justicia y equidad. Un impuesto injusto e inequitativo no está en la órbita constitucional. La tributación puede redistribuir, pero <b>no destruir las fuentes de riqueza</b>: el límite es la <mark>extinción de la propiedad o de la renta</mark>.</p>` },
      { h: "Legalidad y reserva de ley (art. 338)", html: `
        <blockquote>«En tiempo de paz, solamente el Congreso, las asambleas departamentales y los concejos distritales y municipales podrán imponer contribuciones fiscales o parafiscales. La ley, las ordenanzas y los acuerdos deben fijar, directamente, los sujetos activos y pasivos, los hechos y las bases gravables, y las tarifas de los impuestos.»<cite>Art. 338 CP, inciso 1</cite></blockquote>
        <ul>
          <li>Inciso 2: en <b>tasas y contribuciones</b>, las autoridades pueden fijar la tarifa (recuperación de costos o participación en beneficios), pero la ley, ordenanza o acuerdo debe fijar <mark>el sistema y el método</mark>.</li>
          <li>Inciso 3: en tributos de <b>período</b>, la norma solo se aplica a partir del período que comience <b>después</b> de su vigencia.</li>
        </ul>
        <p>Tres rasgos (C-511 de 2019): <b>(i) reserva de ley</b> (solo órganos de representación popular; prohibición de facultades extraordinarias para decretar impuestos, art. 150-10); <b>(ii) certeza tributaria</b> (claridad y precisión en los elementos); <b>(iii)</b> el legislador puede autorizar a la administración a reglamentar aspectos, dentro del marco legal.</p>
        <p>C-269 de 2019: <i>nullum tributum sine lege</i>. Alfredo Lewin (2002): la obligación de pagar tributos tiene como única fuente la ley (<i>no taxation without representation</i>). La legalidad también implica que la actuación administrativa se ajuste a la ley.</p>` },
      { h: "Igualdad (art. 13)", html: `<p>La ley debe dar igual trato a quienes están en circunstancias iguales o análogas: igual trato a los iguales (<mark>equidad horizontal</mark>) y trato desigual a los desiguales (<mark>equidad vertical</mark>) (Lewin, 2002).</p>` },
      { h: "Buena fe y confianza legítima (art. 83)", html: `
        <p>Las actuaciones de particulares y autoridades deben ceñirse a la buena fe, la cual <b>se presume</b> en las gestiones de los particulares ante las autoridades.</p>
        <p>C-131 de 2004: incorpora el valor ético de la confianza; orienta las facultades discrecionales y ayuda a colmar lagunas.</p>
        <p>T-956 de 2011: la buena fe tiene dos manifestaciones: <mark>respeto por el acto propio</mark> y <mark>confianza legítima</mark>.</p>
        <p>T-1094 de 2005: la confianza legítima protege al administrado frente a cambios intempestivos. El Estado no puede alterar súbitamente las reglas de juego sin un <b>período de transición</b>. No protege derechos adquiridos, sino <b>expectativas válidas</b> formadas por acciones u omisiones estatales prolongadas.</p>` },
      { h: "Progresividad (art. 363)", html: `
        <p>Quien tiene mayor capacidad contributiva asume obligaciones <b>más que proporcionales</b> (Lewin, 2002). Es más un concepto político que técnico.</p>
        <p>Test de no regresividad (C-228 de 2011, con base en el juicio de igualdad): <mark>idoneidad</mark> (fin constitucionalmente legítimo), <mark>necesidad</mark> (la medida menos regresiva entre las posibles) y <mark>proporcionalidad en sentido estricto</mark>. C-038 de 2004: la medida no debe ser inopinada, debe haberse estudiado alternativas y no ser desproporcionada.</p>` },
      { h: "Eficiencia (art. 363)", html: `
        <p>Dos vertientes (C-543 de 2005): <mark>eficiencia del tributo</mark> (relación costo-beneficio entre administrar el tributo y lo que produce) y <mark>eficiencia del recaudo</mark> (idoneidad de los medios para cobrarlo).</p>
        <p>Ejemplo clásico: el <b>impuesto de papel sellado</b> fue suprimido porque su administración resultaba más onerosa que lo que recaudaba.</p>` },
      { h: "Irretroactividad (arts. 338 y 363)", html: `
        <p>No se pueden señalar consecuencias jurídicas a hechos ya formalizados jurídicamente, salvo que se prescriba un efecto “más perfecto” para el sujeto y el bien común de manera concurrente (C-549 de 1993).</p>
        <p>Regla para impuestos de período: los cambios se aplican desde el <mark>período siguiente</mark> al inicio de la vigencia de la norma.</p>` },
      { h: "Debido proceso (art. 29)", html: `
        <p>Se aplica a toda actuación judicial y <b>administrativa</b>. Incluye: leyes preexistentes, juez competente, plenitud de las formas, favorabilidad en lo penal, presunción de inocencia, defensa técnica, proceso sin dilaciones, derecho a probar y contradecir, impugnar la sentencia condenatoria y <i>non bis in idem</i>. <mark>Es nula de pleno derecho la prueba obtenida con violación del debido proceso.</mark></p>
        <p>C-248 de 2013: en toda actuación administrativa debe existir un proceso debido que impida la arbitrariedad.</p>` },
      { h: "Métodos de interpretación", html: `
        <p>Las normas tienen <b>textura abierta</b>: pueden presentar insuficiencias, contradicciones, ambigüedad, oscuridad o lagunas. El intérprete tiene un papel activo.</p>
        <ul>
          <li><b>Literal o gramatical</b>: art. 27 Código Civil: «cuando el sentido de la ley sea claro, no se desatenderá su tenor literal a pretexto de consultar su espíritu». Arts. 28-29: sentido natural y obvio; palabras técnicas según su ciencia o arte. Art. 30: el contexto ilustra el sentido; pasajes oscuros se aclaran con otras leyes sobre el mismo asunto.</li>
          <li><b>Lógica</b> (C-425 de 2002): estructura deóntica de regla y excepción.</li>
          <li><b>Teleológica</b>: busca la finalidad o propósito de la norma (Piccato, 2006).</li>
          <li><b>Histórica</b>: antecedentes, como el debate legislativo, para hallar la intención.</li>
          <li><b>Sistemática</b>: relaciona la norma con fines, valores y principios constitucionales más abstractos (López Medina, 2006).</li>
        </ul>
        <p>Además, la Corte Constitucional aplica <b>tests</b> de ponderación. <b>Bártolo de Sassoferrato</b> (Edad Media) introdujo la idea de la “razón de la ley”: las normas no se aplican ciegamente.</p>` }
    ],
    trampas: [
      "Las fuentes AUXILIARES del art. 230 son cuatro: equidad, jurisprudencia, principios generales del derecho y doctrina. La costumbre no está en el art. 230, pero la Corte la reconoce como fuente.",
      "Principios generales del derecho ≠ principios constitucionales.",
      "Solo en TASAS y CONTRIBUCIONES la autoridad puede fijar la tarifa, y siempre con sistema y método fijados por ley, ordenanza o acuerdo. Nunca en impuestos.",
      "Art. 363 = equidad, eficiencia y progresividad + no retroactividad.",
      "Confianza legítima protege expectativas, NO derechos adquiridos.",
      "La eficiencia tiene dos vertientes: del tributo y del recaudo. El ejemplo es el papel sellado."
    ]
  },
  /* ---------------- TEMA 3 ---------------- */
  {
    id: "t3", short: "Elementos de la obligación tributaria",
    title: "Aplicación de los elementos de la obligación tributaria a los impuestos administrados por la DIAN",
    sintesis: `El art. 338 exige que la ley fije directamente sujetos activos y pasivos, hechos generadores, bases gravables y tarifas. La DIAN administra los tributos de mayor recaudo (renta, IVA, patrimonio, entre otros). Conocer estos elementos es un deber tanto de la administración como del contribuyente.`,
    diagrams: ["obligacion", "base", "tarifas"],
    blocks: [
      { h: "Definiciones de la DIAN (Concepto Unificado 0003 de 2002, IVA)", html: `
        <ul>
          <li><mark>Hecho generador</mark>: presupuesto establecido en la ley cuya realización origina el nacimiento de la obligación. Es el elemento objetivo.</li>
          <li><mark>Sujeto activo</mark>: acreedor de la obligación; el Estado queda facultado para exigir unilateral y obligatoriamente el pago cuando ocurre el hecho generador.</li>
          <li><mark>Sujeto pasivo</mark>: deudor de la obligación.</li>
          <li><b>Sujeto pasivo económico</b>: quien adquiere bienes o servicios gravados y soporta el impuesto. No es parte de la obligación sustancial, pero a él se traslada el tributo.</li>
          <li><b>Sujeto pasivo de derecho</b>: responsable del recaudo; declara y paga, so pena de sanciones administrativas (extemporaneidad, moratoria) y penales.</li>
          <li><mark>Base gravable</mark>: magnitud o medición del hecho gravado a la que se aplica la tarifa.</li>
          <li><mark>Tarifa</mark>: porcentaje o valor que, aplicado a la base, determina el impuesto.</li>
        </ul>
        <p>Caso especial: el sujeto pasivo de derecho y el económico pueden coincidir. El ejemplo del concepto (de 2002) es el responsable del entonces “régimen común” que compra a uno del “régimen simplificado”: genera el IVA, practica la retención (reteiva) y asume el gravamen.</p>
        <div class="nota">Actualización terminológica: desde las Leyes 1943 de 2018 y 2010 de 2019 se habla de <b>responsables</b> y <b>no responsables</b> de IVA, no de régimen común y simplificado. El concepto del módulo es de 2002.</div>` },
      { h: "Sujetos activos", html: `
        <p>El Estado tiene <b>poder tributario</b> (crear tributos), pero como <b>sujeto activo</b> está sometido a la ley tributaria, que le fija límites y deberes de debido proceso (Bravo Arteaga, 2012).</p>
        <blockquote>Art. 683 del Estatuto Tributario (espíritu de justicia): los funcionarios deben aplicar rectamente las leyes con un relevante espíritu de justicia; el Estado <b>no aspira a que al contribuyente se le exija más</b> de aquello con lo que la ley ha querido que contribuya.</blockquote>
        <p>Pueden ser sujetos activos:</p>
        <ul>
          <li><b>La Nación, a través de la DIAN</b>: tributos nacionales y los que la ley no asigne a otra entidad.</li>
          <li><b>Entidades territoriales</b>: departamentos, distritos y municipios (industria y comercio, predial, impuesto al consumo de cervezas).</li>
          <li><b>Entidades privadas</b> con competencias delegadas en contribuciones parafiscales (p. ej., Federación Nacional de Cafeteros).</li>
        </ul>` },
      { h: "Sujetos pasivos", html: `
        <p>Por regla general, toda persona natural o jurídica puede ser sujeto pasivo. Las personas jurídicas son ficciones: el gravamen repercute finalmente en las personas naturales dueñas.</p>
        <p>En renta hay sujetos pasivos que no son personas en el derecho común: <mark>sucesiones ilíquidas, sociedades de hecho, comunidades organizadas, sociedades de minas y algunos fondos</mark>.</p>
        <p>C-333 de 2017: sujeto pasivo <b>de iure</b> (paga formalmente) y <b>de facto</b> (soporta económicamente). En impuestos <b>directos</b> (renta) suelen coincidir; en <b>indirectos</b> (IVA) el de iure traslada el costo al consumidor final.</p>` },
      { h: "Hecho generador", html: `
        <p>Importa por dos razones: marca <mark>el momento en que nace la obligación</mark> y señala la norma reguladora aplicable (Bravo Arteaga).</p>
        <ul>
          <li><b>Elemento objetivo</b>: acto jurídico relacionado con un hecho económico que implica capacidad de pago. Comprende: un acto jurídico (percibir ingreso, vender, importar, prestar servicio), una forma jurídica (ejercicio de un derecho, negocio jurídico), una materia o bien (tangible o intangible) y la capacidad económica del titular.</li>
          <li><b>Elemento subjetivo</b>: calidades de los sujetos (natural o jurídica, nacional o extranjera).</li>
          <li><b>Elemento temporal</b>: “causación”: cuándo nace la obligación y cuándo es exigible.</li>
          <li><b>Elemento espacial</b>: si el tributo es nacional, departamental o municipal, y si el hecho ocurrió dentro o fuera del país.</li>
        </ul>` },
      { h: "Base gravable", html: `
        <p>«Magnitud o medición del hecho gravado, a la cual se le aplica la tarifa» (C-412 de 1996). Es el <mark>aspecto cuantitativo</mark> del hecho gravado; también se llama <b>parámetro</b>. Ferreiro Lapatza: dimensión del elemento del hecho generador que se juzga determinante de la capacidad contributiva.</p>
        <p>Cómo se establece:</p>
        <ul>
          <li><b>Directa</b>: timbre (la cuantía del documento).</li>
          <li><b>Por integración</b>: IVA (precio + financiación, acarreos, instalaciones, seguros, comisiones, garantías y accesorios).</li>
          <li><b>Por depuración</b>: renta (ingreso bruto menos costos, gastos y rentas exentas = renta líquida gravable).</li>
        </ul>
        <p>Clasificaciones: <mark>simple</mark> (coincide con la cuantía del hecho) vs <mark>compuesta</mark> (varios hechos en un período); <mark>bruta</mark> vs <mark>líquida</mark> (depurada); <mark>real</mark> (cuantías reales) vs <mark>presuntiva</mark> (determinación indirecta por presunciones legales).</p>
        <p>Elementos constitutivos:</p>
        <ul>
          <li><b>Inclusiones</b>: lo que integra la materia económica (ingresos en renta, precio en IVA).</li>
          <li><b>Exclusiones</b>: lo que no debe incluirse; lógicas (ingresos de otro año) o legales (ingresos no constitutivos de renta).</li>
          <li><b>Depuración</b>: detraer costos o deducciones.</li>
          <li><b>Exenciones</b>: valores que <b>sí hacen parte</b> de las inclusiones, pero el legislador ordena detraerlos después (justicia, equidad, conveniencia o fomento).</li>
        </ul>` },
      { h: "Tarifa", html: `
        <p>Magnitud que, aplicada a la base, da la cuantía del tributo. Clasificación (Bravo Arteaga, 2012):</p>
        <ul>
          <li><b>Fija</b>: cuantía fija por operación. Ej.: timbre de cheques (art. 521 ET), 0,0003 UVT por cheque (≈ $11 en 2021, según el módulo).</li>
          <li><b>Proporcional</b>: alícuota constante. Ej.: IVA general del <mark>19 %</mark>.</li>
          <li><b>Progresiva</b>: la alícuota aumenta al aumentar la base.</li>
          <li><b>Regresiva</b>: la tarifa baja cuando la base sube. Conceptualmente existe, pero <mark>el ordenamiento la proscribe</mark>.</li>
        </ul>
        <p><b>C-1067 de 2002</b>: (1) el Congreso no puede delegar en el Gobierno la creación de gravámenes; (2) la excepción para que la autoridad fije la tarifa es restrictiva y solo aplica a <b>tasas y contribuciones</b>; (3) la ley debe fijar claramente <b>el método y el sistema</b>, que son reglados, no discrecionales. Sin ellos, la contribución es inconstitucional.</p>
        <p><b>C-455 de 1994</b>: <mark>métodos</mark> = pautas técnicas para definir los criterios relevantes de costos y beneficios; <mark>sistemas</mark> = formas específicas de medición económica, valoración y ponderación de los factores. Son obligatorios y son garantía del contribuyente.</p>` }
    ],
    trampas: [
      "Exención ≠ exclusión: la exención SÍ hace parte de las inclusiones y luego se detrae; la exclusión nunca entra a la base.",
      "El sujeto pasivo económico NO es parte de la obligación tributaria sustancial.",
      "En impuestos directos (renta) el sujeto de iure y de facto suelen coincidir; en indirectos (IVA) no.",
      "Tarifas regresivas: existen conceptualmente pero están proscritas.",
      "Método = pautas técnicas/criterios; Sistema = formas de medición y valoración (C-455/94).",
      "El elemento temporal del hecho generador se llama “causación”."
    ]
  },
  /* ---------------- TEMA 4 ---------------- */
  {
    id: "t4", short: "Sistema de gestión de la DIAN",
    title: "Sistema de gestión de la Unidad Administrativa Especial DIAN",
    sintesis: `No basta con conocer el “qué” (funciones, objetivos, competencias); hay que entender el “cómo” se gestionan. El sistema de gestión es el conjunto de políticas, normas, recursos e información orientado al mejor desempeño institucional, a resultados para los ciudadanos, en un marco de legalidad e integridad.`,
    diagrams: ["tiposprocesos", "riesgos"],
    blocks: [
      { h: "La entidad: naturaleza y objetivo", html: `
        <p><b>Decreto 1071 de 1999</b>: UAE del orden nacional, técnica y especializada, con personería jurídica, autonomía administrativa y presupuestal, patrimonio propio, adscrita al MHCP.</p>
        <p><b>Objetivo (art. 4, D. 1071/99)</b>: «coadyuvar a garantizar la <mark>seguridad fiscal del Estado</mark> colombiano y la protección del <mark>orden público económico nacional</mark>, mediante la administración y control al debido cumplimiento de las obligaciones tributarias, aduaneras y cambiarias, y la facilitación de las operaciones de comercio exterior en condiciones de equidad, transparencia y legalidad».</p>` },
      { h: "Competencia (Decreto 1742 de 2020, art. 1)", html: `
        <ul>
          <li>Administrar renta y complementarios, timbre nacional, ventas, derechos de aduana y demás impuestos internos nacionales no asignados a otra entidad; dirigir la gestión aduanera (incluida aprehensión, decomiso o declaración en abandono).</li>
          <li>Control y vigilancia del <b>régimen cambiario</b> en importación y exportación de bienes y servicios, gastos asociados, financiación en moneda extranjera, subfacturación y sobrefacturación.</li>
          <li>Administrar impuestos comprende: <mark>recaudación, fiscalización, liquidación, discusión, cobro, devolución, sanción</mark> y demás aspectos.</li>
          <li>Administrar derechos de aduana comprende lo mismo <b>sin devolución</b>: recaudación, fiscalización, liquidación, discusión, cobro y sanción.</li>
          <li>Mantener la <b>unidad doctrinal</b> en la interpretación y generar estadísticas.</li>
          <li>Recaudar el <b>ICA consolidado en el régimen SIMPLE</b> (par. 2, art. 908 ET).</li>
        </ul>` },
      { h: "Funciones generales (Decreto 4048 de 2008, art. 3)", html: `
        <p>El módulo transcribe 20 funciones. Las más preguntables:</p>
        <ol>
          <li>Administrar renta, ventas, nacional al consumo, patrimonio, GMF, timbre, gasolina y ACPM, derechos de aduana y demás impuestos internos nacionales no asignados.</li>
          <li>Dirigir y administrar la gestión y operación aduanera.</li>
          <li>Controlar obligaciones tributarias, aduaneras y cambiarias (subfacturación y sobrefacturación).</li>
          <li>Administrar y disponer de mercancías aprehendidas, decomisadas o en abandono.</li>
          <li>Dirigir la <b>transformación digital</b>.</li>
          <li>Controlar operaciones cambiarias que no sean de otra entidad.</li>
          <li>Autorizar y vigilar a <b>profesionales de compra y venta de divisas</b>.</li>
          <li>Pagar <b>recompensas</b> por colaboración eficaz contra contrabando, evasión y corrupción.</li>
          <li>Ejercer funciones de <mark>Policía Judicial</mark>.</li>
          <li>Supervisar a la <b>Policía Fiscal y Aduanera</b> (POLFA).</li>
          <li>Celebrar convenios (cultura de la contribución, intercambio de información, protección de datos).</li>
          <li>Participar en estándares tributarios internacionales.</li>
          <li>Administrar el <mark>Registro Único de Beneficiarios Finales (RUB)</mark>.</li>
          <li>Ser <b>autoridad doctrinaria</b>.</li>
          <li>Conceptuar sobre proyectos de ley, decretos y acuerdos internacionales.</li>
          <li>Diseñar y evaluar el <b>sistema de control interno</b>.</li>
          <li>Administrar recursos humanos, financieros, físicos y de conocimiento.</li>
          <li>Compilar y divulgar normas.</li>
          <li>Desarrollar actuaciones administrativas necesarias.</li>
          <li>Las demás que le asigne la ley.</li>
        </ol>` },
      { h: "Tipos de procesos", html: `
        <ul>
          <li><b>Estratégicos</b>: orientan a la entidad para cumplir misión, visión, política y objetivos.</li>
          <li><b>Misionales</b>: la razón de ser; incluyen además los derechos de explotación y gastos de administración de juegos de suerte y azar de entidades públicas nacionales.</li>
          <li><b>De apoyo</b>: soportan a los estratégicos, misionales y de evaluación.</li>
          <li><b>De evaluación y control</b>: medición, seguimiento, auditoría interna, acciones correctivas y preventivas.</li>
        </ul>` },
      { h: "Gestión humana", html: `<p>Gestiona el <mark>ciclo de vida del servidor público</mark>: vinculación, prácticas y judicaturas, aprendices SENA, designaciones y revocatorias, asignación de funciones, desvinculación y retiro, vacaciones, horas extras, embargos de salarios y nómina.</p>` },
      { h: "Gestión de riesgos", html: `
        <p>La DIAN identifica, describe, valora, evidencia, define frecuencia y controles para sus riesgos, con responsables. Hay programas transversales, como el de <b>anticorrupción</b>. Riesgos por área (resumen en el esquema “Mapa de riesgos”):</p>
        <ol>
          <li><b>Administración de cartera</b>: trámites complejos u obsoletos, tecnología insuficiente, aplicativos inadecuados, falta de competencia gerencial, indebida sustanciación.</li>
          <li><b>Asistencia al cliente</b>: falta de compromiso, desconocimiento de la estrategia, desacuerdos.</li>
          <li><b>Comercialización</b>: procedimientos desactualizados, ausencia de valores, deficiencias reglamentarias.</li>
          <li><b>Control interno</b>: capacidad operativa, conflictos de interés, falta de metodología de muestreo, desconocimiento normativo.</li>
          <li><b>Fiscalización</b>: personal insuficiente o poco capacitado, programas de baja calidad, recursos físicos y TI insuficientes.</li>
          <li><b>Gestión humana</b>: discrecionalidad indebida, decisiones desinformadas, desconocimiento del modelo por competencias.</li>
          <li><b>Gestión jurídica</b>: tráfico de influencias, falta de ética, no aplicar procedimientos, constreñimiento.</li>
          <li><b>Gestión masiva</b>: deficiencias del RUT, personal insuficiente, cargas excesivas.</li>
          <li><b>Inteligencia</b>: desconocimiento normativo, insumos deficientes, indicadores inapropiados.</li>
          <li><b>Recaudo</b>: sistemas no funcionales, información contable incompleta, descripción inadecuada de hechos, idoneidad del documento fuente.</li>
        </ol>` },
      { h: "Documentación, seguridad y privacidad", html: `
        <p><b>Gestión documental</b>: la información tributaria del contribuyente <mark>no es pública</mark>; hay manuales para clasificar información clasificada, reservada y sensible, con custodios definidos.</p>
        <p><b>Política de Seguridad y Privacidad de la Información</b>: incorporar la seguridad en todos los procesos para preservar la <mark>confidencialidad, integridad y disponibilidad</mark> y proteger los datos personales. Se implementa mediante el <b>SGSI</b> (Sistema de Gestión de Seguridad de la Información) con mejora continua.</p>` },
      { h: "Calidad y control interno", html: `
        <p><b>SGCCI</b> (DAFP): crea la necesidad de <b>autogestionarse</b>, trabajar coordinadamente y tener objetivos claros, bajo calidad y ética.</p>
        <p><b>Control interno</b>: mediante asesoría, acompañamiento y auditorías internas evidencia desviaciones para que los responsables de los procesos hagan los correctivos.</p>` }
    ],
    trampas: [
      "La administración ADUANERA no incluye “devolución” en el listado del módulo; la de IMPUESTOS sí.",
      "El objetivo de la DIAN está en el art. 4 del Decreto 1071 de 1999; las funciones generales en el art. 3 del Decreto 4048 de 2008; la competencia en el art. 1 del Decreto 1742 de 2020.",
      "La DIAN recauda el ICA dentro del régimen SIMPLE (par. 2, art. 908 ET), aunque es un impuesto municipal.",
      "Seguridad de la información = Confidencialidad, Integridad, Disponibilidad (CID) + protección de datos personales.",
      "Los procesos de evaluación y control incluyen auditoría interna y acciones correctivas y preventivas."
    ]
  },
  /* ---------------- TEMA 5 ---------------- */
  {
    id: "t5", short: "Planes, valores y políticas",
    title: "Planes, valores y políticas de la DIAN: historia, estructura, misión, visión, valores, procesos y programas de control",
    sintesis: `La DIAN financia los planes de desarrollo mediante la administración y control de las obligaciones tributarias, aduaneras y cambiarias. Este tema recorre su historia, su ubicación en el sector Hacienda, su estructura en tres niveles, su misión, visión y valores, su mapa de procesos y el Plan de Choque contra la Evasión y el Contrabando.`,
    diagrams: ["historia", "niveles", "funciones", "mapaprocesos", "pilares"],
    blocks: [
      { h: "Ministerio de Hacienda y Crédito Público", html: `
        <p>Denominaciones: <mark>1821 Secretaría de Hacienda</mark> → <mark>1886 Hacienda y del Tesoro</mark> → <mark>1923 Ministerio de Hacienda y Crédito Público</mark>.</p>
        <p><b>Decreto 2112 de 1992, art. 1</b>: es la cartera de mayor complejidad; formula las políticas fiscal tributaria, aduanera, de crédito público, presupuestal, de tesorería, cambiaria, monetaria y crediticia (sin perjuicio de la Junta Directiva del Banco de la República) y la intervención en actividades financiera, bursátil y aseguradora.</p>
        <p>La DIAN está en el <b>sector descentralizado</b> del sector Hacienda (Ley 489/98, art. 68: UAE con personería jurídica) y es una <b>entidad adscrita</b>.</p>` },
      { h: "Reseña histórica de la DIAN", html: `
        <ul>
          <li><b>Decreto 1643 de 1991</b>: crea la UAE Dirección de Impuestos Nacionales (<b>DIN</b>).</li>
          <li><b>Ley 6 de 1992, art. 106</b>: transforma la Dirección General de Aduanas en UAE Dirección de Aduanas Nacionales (<b>DAN</b>).</li>
          <li><b>Decreto 2117 de 1992</b>: <mark>fusiona DIN y DAN</mark> en la DIAN.</li>
          <li><b>Decreto 2116 de 1992</b>: suprime la <b>Superintendencia de Cambios</b> y asigna a la DIAN el control cambiario.</li>
          <li><b>Ley 488 de 1998</b>: faculta al Presidente para organizar la DIAN con personería jurídica.</li>
          <li><b>Decreto 1071 de 1999</b>: la organiza con personería jurídica, autonomía administrativa y presupuestal y patrimonio propio.</li>
          <li><b>Decreto 4048 de 2008</b> (22 de octubre): modifica la estructura.</li>
          <li><b>Decreto 1742 de 2020</b> (22 de diciembre): deroga el 4048 y fija la estructura en <b>tres niveles</b>: central, local y delegado.</li>
        </ul>
        <p>Otros decretos de la Tabla 1 que pueden preguntarse: <b>D. 1072 de 1999</b>, Sistema Específico de Carrera y programa de incentivos; <b>D. 1073 de 1999</b>, régimen disciplinario especial; <b>D. 1074 de 1999</b>, régimen sancionatorio de infracciones cambiarias; <b>D. 1265 de 1999</b>, organización interna y distribución de funciones; <b>D. 4171 de 2011</b>, crea el Consejo Directivo; <b>D. 2245 de 2011</b>, régimen sancionatorio y procedimiento administrativo cambiario.</p>
        <div class="nota">La Tabla 1 del PDF viene desalineada al extraer el texto. Antes del examen, contrasta los números de decreto de 1999 con la fuente oficial (Función Pública / SUIN-Juriscol).</div>` },
      { h: "Estructura actual: tres niveles (D. 1742/2020)", html: `
        <p><b>Nivel central</b>: imparte instrucciones generales. Lo integran la <b>Dirección General</b> (4 oficinas) y las direcciones de Gestión de Impuestos (7 subdirecciones), Aduanas (6), Fiscalización (5), Corporativa (8), Estratégica y de Analítica (6), Innovación y Tecnología (4), Jurídica (4), Policía Fiscal y Aduanera (2) y la Dirección Operativa de Grandes Contribuyentes (5). Órganos asesores y especiales: <mark>Defensor del Contribuyente y del Usuario Aduanero</mark> y <mark>Comité Institucional Estratégico (CIE)</mark>.</p>
        <p><b>Nivel local</b>: ejecuta políticas e instrucciones del central según la naturaleza de la seccional; responde por la ejecución del Plan Estratégico. Seccionales de impuestos, <mark>7 de aduanas</mark> y <mark>32 de impuestos y aduanas</mark>.</p>
        <p><b>Nivel delegado</b>: el Director General, por <b>resolución</b> y con disponibilidad presupuestal, autoriza seccionales delegadas permanentes o transitorias donde la actividad económica o ubicación lo amerite, indicando jurisdicción y grupos internos (art. 7, D. 1742/2020).</p>
        <div class="nota">El módulo está actualizado a 2021. Verifica si la estructura del Decreto 1742 de 2020 ha tenido modificaciones posteriores antes de la prueba.</div>` },
      { h: "Objeto, misión y visión", html: `
        <p><b>Objeto</b>: coadyuvar a garantizar la seguridad fiscal del Estado y la protección del orden público económico nacional, mediante la administración y control de las obligaciones tributarias, aduaneras y cambiarias, y la facilitación del comercio exterior en condiciones de <mark>equidad, transparencia y legalidad</mark>.</p>
        <p><b>Misión</b> (razón de ser): <mark>facilitar y garantizar el entendimiento y cumplimiento</mark> de los deberes tributarios, aduaneros y cambiarios, para contribuir a la <b>seguridad fiscal</b> del Estado y la <b>competitividad</b> del país.</p>
        <p><b>Visión</b> (expectativa ideal): ser reconocida como una organización <mark>innovadora y referente</mark> del Estado y de otras administraciones del mundo, generando <b>confianza y orgullo</b> en sus grupos de interés.</p>` },
      { h: "Valores (Código de Ética 2021)", html: `
        <p>Seis valores: <mark>honestidad, respeto, compromiso, justicia, diligencia e innovación</mark>.</p>
        <ul>
          <li><b>Honestidad</b>: actúo con fundamento en la verdad, con transparencia y rectitud, favoreciendo el interés general. “Para ser impecable no necesito testigos.”</li>
          <li><b>Respeto</b>: reconozco, valoro y trato dignamente a todas las personas, sin importar labor, procedencia o títulos. “Soy amable todos los días.”</li>
          <li><b>Compromiso</b>: consciente de mi rol como servidor, dispuesto a comprender y resolver necesidades. Empatía, escucha, servicio ágil.</li>
          <li><b>Justicia</b>: actúo con imparcialidad garantizando derechos, con equidad, igualdad y sin discriminación. Decisiones basadas en evidencia.</li>
          <li><b>Diligencia</b>: cumplo deberes con atención, prontitud, destreza y eficiencia. “Lo público es de todos y no se desperdicia.” “No son aceptables las gestiones a medias.”</li>
          <li><b>Innovación</b>: me adapto a los cambios; aporto a la transformación de procesos y servicios ágiles, eficientes y cercanos.</li>
        </ul>
        <div class="nota">Diferencia con el Código de Integridad del Servicio Público (DAFP), que tiene cinco valores: honestidad, respeto, compromiso, diligencia y justicia. La DIAN suma <b>innovación</b>.</div>` },
      { h: "Mapa de procesos 2021 y plan estratégico", html: `
        <p>Desde 2020: <mark>4 perspectivas</mark> y <mark>7 procesos</mark>.</p>
        <ul>
          <li><b>Financiera</b>: proceso Administrativo y financiero (operación logística, recursos administrativos, compras y contratos, función pagadora, función recaudadora).</li>
          <li><b>Servicio al cliente</b>: proceso Cercanía al ciudadano (asistencia al usuario, factura electrónica y servicios digitales, Defensoría del Contribuyente y del Usuario Aduanero).</li>
          <li><b>Misional</b>: Cumplimiento de obligaciones tributarias y Cumplimiento de obligaciones aduaneras y cambiarias (administración de cartera, recaudo-devoluciones, gestión del riesgo y programas, fiscalización y liquidación, operación aduanera).</li>
          <li><b>Apoyo</b>: Talento humano; Planeación estratégica y control; Información, innovación y tecnología.</li>
        </ul>
        <p><b>Plan estratégico</b> (proyectado a 2022) con metodología <b>MIPG</b> (Modelo Integrado de Planeación y Gestión). Cuatro pilares de transformación: <mark>talento humano, tecnología, cercanía al ciudadano, legitimidad y sostenimiento fiscal</mark>, bajo el eslogan “hacia una Colombia más honesta”.</p>
        <div class="nota">Para tu curso (cartera, recaudo y devoluciones): “Administración de cartera” y “Recaudo-Devoluciones” son subprocesos de la perspectiva <b>misional</b>, mientras que “Función recaudadora” está en la perspectiva <b>financiera</b>.</div>` },
      { h: "Plan de Choque contra la Evasión y el Contrabando", html: `
        <p>Fundamento: <b>Ley 223 de 1995, arts. 147 y ss.</b> La DIAN lo presenta <mark>cada año al Ministro de Hacienda</mark>, con estrategias y objetivos de recaudo para el año siguiente. Evasión y contrabando atentan contra el comercio lícito, las finanzas del Estado y sirven al lavado de activos.</p>
        <p>Plan 2020: <b>cinco pilares</b>, cada uno con frente tributario, aduanero e integral.</p>
        <ol>
          <li><b>Gestión de riesgos en datos (BI)</b>: factura electrónica, riesgo de créditos fiscales, selectividad aduanera, convenios con otras aduanas, control masivo con inteligencia de datos.</li>
          <li><b>Focalización y priorización sectorial</b>: grupos económicos en Grandes Contribuyentes, economía digital, beneficios para la reactivación, productos sensibles.</li>
          <li><b>Desarticulación de estructuras delictivas</b>: estrategia penal tributaria y aduanera, plataformas de pago, divisas informales, cadena de suministro, tráfico postal y envíos urgentes, denuncias, Comisión Interinstitucional contra contrabando, evasión y lavado.</li>
          <li><b>Control inductivo “hacia una Colombia más honesta”</b>: régimen SIMPLE, declaración sugerida, usuarios de trámite especial, OEA, cultura de la legalidad, campaña “Lo público es nuestro”.</li>
          <li><b>Control extensivo y facilitación</b>: control conjunto municipal-nacional, plataformas de transporte, IVA a servicios desde el exterior, calidad del RUT, pérdidas de establecimientos permanentes, acciones <b>BEPS</b>, zonas francas, CIPPA, pasos de frontera.</li>
        </ol>` }
    ],
    trampas: [
      "Orden de nombres del Ministerio: 1821 Secretaría de Hacienda → 1886 Hacienda y del Tesoro → 1923 MHCP.",
      "DIN 1991 (D. 1643) + DAN 1992 (Ley 6, art. 106) → fusión en DIAN por D. 2117 de 1992. El D. 2116/92 suprimió la Superintendencia de Cambios.",
